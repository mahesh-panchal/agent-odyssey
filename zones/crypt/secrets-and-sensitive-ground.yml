pass: 0.8
questions:
  - type: sort
    prompt: "Sort each habit into good practice or bad practice."
    bins: ["Good practice", "Bad practice"]
    explain: "Good habits keep secrets and sensitive data out of what the agent can read or send. Bad ones leave them where a prompt can carry them away."
    items:
      - { text: "Paste your API key into the chat so the agent can test the call", bin: "Bad practice", misconception: "A pasted key may be stored or sent, and it ends up in the transcript. Keep keys in a secret store outside the project folder." }
      - { text: "Keep keys outside the project folder, and add a read-deny rule for any secrets file that has to be there", bin: "Good practice", misconception: "Keeping secrets out of reach, plus a deny rule as a second layer, reduces the chance of leaking them." }
      - { text: "Copy your whole settings directory into the project so the agent 'has the same setup'", bin: "Bad practice", misconception: "Settings directories often contain keys and tokens. Copy only what is needed." }
      - { text: "Point the agent at a folder of sensitive samples to 'get a feel for the data'", bin: "Bad practice", misconception: "Unless your agreement allows processing it that way, the contents may leave your machine." }
      - { text: "Check your data agreement before using an external service on any real data", bin: "Good practice", misconception: "The agreement decides what is allowed, so check before you send." }
  - type: choice
    prompt: "You are not sure if your project's data may be sent to an external model provider. What do you do?"
    explain: "When in doubt, the owner of the agreement decides."
    options:
      - { text: "Ask whoever owns the agreement before sending anything", correct: true }
      - { text: "Assume it is fine because the provider says it does not train on your data", misconception: "A provider's policy does not replace your project's own agreement." }
      - { text: "Send a small sample to see what happens", misconception: "A small sample is still a disclosure if it is not allowed." }
  - type: choice
    prompt: "You have an unpublished result you would hate to see leaked. You want help from a chat assistant. What is the sensible first step?"
    explain: "Terms and approvals decide what is safe. Your institution's office knows which agreements it has reviewed."
    options:
      - { text: "Ask your research office which tools your institution has reviewed", correct: true }
      - { text: "Paste it into a free consumer chat, since the plan you use is rarely a concern", misconception: "Consumer plans can allow training use depending on a setting, so the terms matter." }
      - { text: "Remove the title and paste the rest, since nobody could tell whose it is", misconception: "A result can still be recognised from its content. Removing a title does not change how the text is used." }
  - type: choice
    prompt: "What does the Claude Code data usage page say about training on Team, Enterprise and API accounts?"
    explain: "The page says Anthropic does not train on code or prompts under commercial terms unless the customer opts in. It does not replace your own agreement."
    options:
      - { text: "No training on prompts or code under commercial terms, unless the customer opts in", correct: true }
      - { text: "Training always happens, with a retention period of 30 days", misconception: "The page ties training to consumer settings or customer opt-in. Thirty days is a retention period for commercial accounts." }
      - { text: "Training is controlled by the same personal setting as for Free and Pro accounts", misconception: "That setting applies to consumer accounts. Commercial accounts follow their terms." }
  - type: choice
    prompt: "A reader wants proof they had an idea first. Which habit helps?"
    explain: "A dated public or internal record shows when the work existed."
    options:
      - { text: "Post a preprint or add a dated lab notebook entry", correct: true }
      - { text: "Keep it only in a private chat transcript with an assistant", misconception: "A chat transcript is not a reliable dated record and may be deleted after the retention period." }
      - { text: "Email it to nobody and trust your memory", misconception: "Memory carries no date a third party can check." }
  - type: choice
    prompt: "A coding agent on a hosted model opens your project's .env file to check a setting. What follows?"
    explain: "With a hosted model, what the agent reads goes to the provider, so the keys are exposed under your plan's retention terms. Rotate them, and keep secrets out of folders the agent can read."
    options:
      - { text: "The keys went to the provider, so rotate them", correct: true }
      - { text: "Nothing, since reading a file is not the same as sending it", misconception: "For a hosted model the file's content becomes part of the prompt, so reading is sending." }
      - { text: "It matters only if the provider trains on your prompts", misconception: "Retention and logging apply whether or not the data is used for training." }
      - { text: "It is undone once you delete the chat afterwards", misconception: "Deleting a chat in your view does not change what the retention terms of your plan allow." }
