pass: 0.8
questions:
  - type: sort
    prompt: "Sort each habit into good practice or bad practice."
    bins: ["Good practice", "Bad practice"]
    explain: "Good habits keep secrets and sensitive data out of what the agent can read or send. Bad ones leave them where a prompt can carry them away."
    items:
      - { text: "Paste your API key into the chat so the agent can test the call", bin: "Bad practice", misconception: "A pasted key may be stored or sent, and it ends up in the transcript. Use an environment variable the agent cannot read." }
      - { text: "Add a deny rule so the agent cannot read your .env file", bin: "Good practice", misconception: "A deny rule is exactly the armour for secrets files." }
      - { text: "Copy your whole settings directory into the project so the agent 'has the same setup'", bin: "Bad practice", misconception: "Settings directories often contain keys and tokens. Copy only what is needed." }
      - { text: "Use mock or synthetic data for exercises and tests", bin: "Good practice", misconception: "Mock data lets you test the workflow without any exposure." }
      - { text: "Point the agent at a folder of sensitive samples to 'get a feel for the data'", bin: "Bad practice", misconception: "Unless your agreement allows processing it that way, the contents may leave your machine." }
      - { text: "Check your data agreement before using an external service on any real data", bin: "Good practice", misconception: "The agreement decides what is allowed, so check before, not after." }
  - type: sort
    prompt: "On a shared HPC cluster, sort each action."
    bins: ["Reasonable", "Not reasonable"]
    explain: "Login nodes are shared and storage is governed by policy. Heavy work goes through the scheduler, and you follow the cluster rules."
    items:
      - { text: "Submit the heavy analysis through the scheduler", bin: "Reasonable", misconception: "The scheduler is how shared compute is meant to be used." }
      - { text: "Let an agent run a long heavy computation directly on the login node", bin: "Not reasonable", misconception: "Login nodes are shared. Long heavy work there slows everyone down." }
      - { text: "Check whether the cluster allows agents and outbound connections before using one", bin: "Reasonable", misconception: "Policies differ between clusters, so check first." }
      - { text: "Give the agent your SSH private key so it can log in for you", bin: "Not reasonable", misconception: "A private key is a credential. Handing it over gives the agent everything you can do." }
      - { text: "Let the agent loop and resubmit jobs without a limit", bin: "Not reasonable", misconception: "An unbounded loop can burn your allocation and flood the queue." }
  - type: choice
    prompt: "You are not sure if your project's data may be sent to an external model provider. What do you do?"
    explain: "When in doubt, the owner of the agreement decides. Until then, use mock data."
    options:
      - { text: "Ask whoever owns the agreement, and use mock data in the meantime", correct: true }
      - { text: "Assume it is fine because the provider says it does not train on your data", misconception: "A provider's policy does not replace your project's own agreement." }
      - { text: "Send a small sample to see what happens", misconception: "A small sample is still a disclosure if it is not allowed." }
  - type: faulty-line
    prompt: "A teammate's setup script for an agent. Which line is the problem?"
    explain: "The key is written into a file that will be committed and may be read by the agent. It should come from an environment variable that is not committed."
    lines:
      - { text: 'export OUTDIR="$HOME/scratch/agent-sandbox"', why: "A sandbox directory is good practice." }
      - { text: 'export API_KEY="sk-live-1234567890abcdef"   # committed to the repo', faulty: true }
      - { text: 'mkdir -p "$OUTDIR"', why: "Creating the output directory is harmless." }
      - { text: 'git init', why: "Version control gives you undo." }
