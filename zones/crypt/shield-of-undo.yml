questions:
  - type: choice
    prompt: "An agent rewrote your analysis script and the results look wrong. Which command returns tracked files to your last commit?"
    explain: "With --staged and --worktree, restore puts tracked files back to the last commit immediately; no new commit is needed. Plain `git restore .` takes its source from the staging area, so staged changes would survive."
    options:
      - { text: "git restore --staged --worktree .", correct: true }
      - { text: "git commit -a -m wip", misconception: "Committing records the broken state as a new snapshot; it does not revert your working files." }
      - { text: "git stash pop --index stash@{0}", misconception: "Pop re-applies earlier stashed changes on top of your files; it does not discard the agent's edits." }
      - { text: "git add -A && git status", misconception: "Staging records the broken state; it does not undo it." }
  - type: choice
    prompt: "When should you commit a snapshot?"
    explain: "A snapshot only protects you if it exists before the mistake happens."
    options:
      - { text: "Before letting the agent make changes", correct: true }
      - { text: "After the agent finishes", misconception: "Committing afterwards snapshots the possibly broken state, so you lose your undo point." }
      - { text: "Only when the project is finished", misconception: "A snapshot only protects you if it exists before the mistake happens." }
  - type: choice
    prompt: "The agent made a new file `scratch.py` and also edited `analysis.py`. You run `git restore --staged --worktree .`. What state are you in?"
    explain: "Restore reverts tracked files. New files stay, so check `git status` for leftovers."
    options:
      - { text: "analysis.py is reverted; scratch.py remains, untracked", correct: true }
      - { text: "Both files are reverted, scratch.py is deleted too", misconception: "restore only reverts tracked files. New untracked files stay until you remove them." }
      - { text: "Nothing changes until you also run git add on the files", misconception: "restore acts on your working files immediately; no commit is needed." }
