pass: 0.8
questions:
  - type: match
    prompt: "Round one: match each worry about the output and your files to the habit that makes it smaller."
    explain: "Every habit here puts a check or a limit between the agent and the result."
    pairs:
      - { left: "It will make things up", right: "Check against something the agent did not write", misconception: "Fabrication is answered by independent checks, not by trusting more or asking the agent again." }
      - { left: "It could delete or overwrite my work", right: "Undo with git, set permission rules, work on a scratch copy", misconception: "Damage is limited by what the agent may touch and whether you can undo it." }
      - { left: "It could leak my data or my secrets", right: "Keep secrets and private data out of prompts, use an approved account or a local model", misconception: "Leaks are limited by what you put in the prompt and where the prompt goes." }
      - { left: "Someone could see my unpublished results and publish first", right: "Read the data terms and keep unpublished work out of consumer chat tools", misconception: "Being scooped is limited by knowing what your tool keeps and avoiding tools your institution has not reviewed." }
      - { left: "It produces slop in bulk", right: "Take small steps, test before code, keep a review budget", misconception: "Bulk output is limited by how much you can honestly review, so shrink the steps." }
  - type: match
    prompt: "Round two: match each worry about learning, review and credit to its habit."
    explain: "These habits keep the learning, the decisions and the credit with you."
    pairs:
      - { left: "I will stop learning", right: "Write it yourself first, or ask it to explain rather than do", misconception: "Learning is protected by deciding when you attempt the work yourself." }
      - { left: "My collaborators will have to review it all", right: "Review it yourself first and send small changes", misconception: "The review burden belongs to the person who sends the change." }
      - { left: "Everyone will expect work faster now", right: "Agree timelines that include review time", misconception: "Expectations settle around what people see, so showing where the time goes keeps them realistic." }
      - { left: "The result will feel hollow, as if it was not my work", right: "Make the decisions and be able to explain each step", misconception: "Ownership grows from the choices you made and your grasp of the result, so those are the habits to build." }
      - { left: "People will think I am lazy for using it", right: "Say what the agent did and what you checked", misconception: "Plain credit and visible checks let the evidence speak for the work." }
  - type: match
    prompt: "Round three: match each worry about your voice and judgement to its habit."
    explain: "These habits keep your voice and your judgement in your own hands."
    pairs:
      - { left: "Everything I write will start to sound the same", right: "Draft in your own words first, then edit", misconception: "A voice stays yours when your own words come first and the agent helps with structure and checks." }
      - { left: "I will spend my days checking drafts", right: "Keep the question and interpretation, and count checking as work", misconception: "Creative work stays with you when you hold the big decisions and give checking its own time." }
      - { left: "I will stop trusting my own judgement", right: "Decide first, then ask for a second opinion", misconception: "Judgement stays in practice when your call comes first and the agent's view comes second." }
      - { left: "I do not understand what it did", right: "Ask for a changelog and explain it back", misconception: "Understanding comes from explaining the change in your own words before you keep it." }
  - type: choice
    prompt: "A colleague says: 'I will never use these tools because they make mistakes.' What is the most useful reply?"
    explain: "Mistakes are the reason for checking habits. Choosing not to use a tool is also a legitimate decision."
    options:
      - { text: "Mistakes are real; the habits limit the cost, and using it at all is your call", correct: true }
      - { text: "Newer models are much better now, so that worry is mostly outdated", misconception: "Models improve, but wrong output has not gone away, so checks are still needed." }
      - { text: "Everyone is adopting them, so you will eventually have to use them too", misconception: "Social pressure is not an argument, and it makes sceptics less likely to engage." }
  - type: sort
    prompt: "Which of these is a real risk to plan for, and which is a myth?"
    bins: ["Real risk", "Myth"]
    explain: "Plan for the real ones with habits, and let the myths go."
    items:
      - { text: "Confident output that is simply wrong", bin: "Real risk", misconception: "Plausible-but-false output is a well-known failure." }
      - { text: "Code that runs but does the wrong calculation", bin: "Real risk", misconception: "Running without error says nothing about correctness." }
      - { text: "The agent has opinions and will refuse to follow your instructions out of spite", bin: "Myth", misconception: "The risk is drift (slowly wandering from your instructions) and misunderstanding." }
      - { text: "A large change that nobody can realistically review", bin: "Real risk", misconception: "Volume that outruns review capacity is a genuine problem." }
      - { text: "A wrong answer can only come from a badly written prompt", bin: "Myth", misconception: "Wrong output happens even with good prompts, so checking is always needed." }
  - type: choice
    prompt: "Which statement about this odyssey is true?"
    explain: "The site never calls an LLM and every exercise runs locally on mock data."
    options:
      - { text: "Everything runs locally on mock data, and the site never calls an LLM", correct: true }
      - { text: "You must send some of your own data to an LLM service for the quests", misconception: "No exercise needs real or sensitive data." }
      - { text: "You must finish every quest before using any tool safely at work", misconception: "Gating is soft. Take the quests that match your worry first." }
