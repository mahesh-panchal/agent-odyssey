pass: 0.8
questions:
  - type: match
    prompt: "Match each worry to the habit that makes it smaller."
    explain: "Every habit here is a way of putting a check or a limit between the agent and the result."
    pairs:
      - { left: "It will make things up", right: "Check against something the agent did not write", misconception: "Fabrication is answered by independent checks, not by trusting more or asking the agent again." }
      - { left: "It could delete my files", right: "Use git, permission rules and a sandbox directory", misconception: "Damage is limited by what the agent is allowed to touch and whether you can undo it." }
      - { left: "My collaborators will have to review it all", right: "Review it yourself first and send small changes", misconception: "The review burden belongs to the person who sends the change." }
      - { left: "I will stop learning", right: "Write it yourself first, or ask it to explain rather than do", misconception: "Learning is protected by deciding when you attempt the work yourself." }
  - type: choice
    prompt: "A colleague says: 'I will never use these tools because they make mistakes.' What is the most useful reply?"
    explain: "Mistakes are the reason for checking habits, not a reason that nobody may ever use a tool. Choosing not to use it is also a legitimate decision."
    options:
      - { text: "Mistakes are real, and these habits limit their cost. Whether to use it at all is still your call", correct: true }
      - { text: "It is very accurate now, so the worry is outdated", misconception: "Accuracy has improved but fabrication has not gone away, and checks are still needed." }
      - { text: "Everyone is using them, so you will have to", misconception: "Social pressure is not an argument, and it makes sceptics less likely to engage." }
  - type: sort
    prompt: "Which of these is a real risk to plan for, and which is a myth?"
    bins: ["Real risk", "Myth"]
    explain: "Plan for the real ones with habits. Do not spend effort on the myths."
    items:
      - { text: "Confident output that is simply wrong", bin: "Real risk", misconception: "Plausible-but-false output is the best-documented failure." }
      - { text: "Code that runs but does the wrong calculation", bin: "Real risk", misconception: "Running without error says nothing about correctness." }
      - { text: "The agent has opinions and will refuse to follow your instructions out of spite", bin: "Myth", misconception: "The risk is drift and misunderstanding, not spite." }
      - { text: "A large change that nobody can realistically review", bin: "Real risk", misconception: "Volume that outruns review capacity is a genuine problem." }
      - { text: "Using an agent once permanently damages your own coding ability", bin: "Myth", misconception: "The risk is habitual outsourcing, which you control by choosing when to write it yourself." }
  - type: choice
    prompt: "Which statement about this odyssey is true?"
    explain: "The site never calls an LLM and every exercise runs locally on mock data."
    options:
      - { text: "Everything runs on your laptop with mock data, and the site itself never calls an LLM", correct: true }
      - { text: "You must send your own data to an LLM service to complete the quests", misconception: "No exercise needs real or sensitive data." }
      - { text: "You must complete every quest before any tool is safe to use", misconception: "Gating is soft. Take the quests that match your worry first." }
