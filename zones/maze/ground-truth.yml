pass: 0.8
questions:
  - type: choice
    prompt: "For seq2 the script prints 20.0 but the independent check gives 6 GC of 10 (60%). What is wrong with the script?"
    explain: "The script counts only uppercase G and C, so the soft-masked lowercase bases are ignored. Soft-masked sequence is common in genome assemblies."
    options:
      - { text: "It counts only uppercase G and C, so lowercase (soft-masked) bases are ignored", correct: true }
      - { text: "It divides by the wrong total length, so the percentage comes out too low", misconception: "Look at seq2: the length (10) is right. The numerator is what is too small." }
      - { text: "Nothing is wrong: lowercase bases are low quality, so 20.0 is the right GC", misconception: "Lowercase here marks masked repeats, not bad bases. They are still bases, and they still count towards GC content." }
      - { text: "It counts lowercase a and t as if they were G or C, which inflates the result", misconception: "That would push the number up, but 20.0 is below the true 60%. The script is ignoring lowercase G and C, not over-counting." }
  - type: choice
    prompt: "For seq3 (`GCNNNNAT`) the script prints 25.0, i.e. 2 GC out of all 8 positions, N included. Is this a bug?"
    explain: "Whether to count N in the denominator is a decision. Make it deliberately, state it, and test it, so the agent never decides it silently."
    options:
      - { text: "A policy choice: decide if N counts in the length, then document and test it", correct: true }
      - { text: "Definitely a bug: 50% is the only right answer, so fix the script to exclude N", misconception: "Both 2/8 and 2/4 are defensible. The point is that the choice is made on purpose and written down." }
      - { text: "Definitely correct: the agent chose the standard definition, so leave it as is", misconception: "There is no single standard. The agent made the choice silently, and that is exactly what you want to decide yourself." }
  - type: choice
    prompt: "The agent says it tested the script on seq1 and it passed. Why is that not enough?"
    explain: "seq1 is the happy path. The bug lives in cases the test data did not include: lowercase and N."
    options:
      - { text: "seq1 had no lowercase and no N, so the failing cases were never exercised", correct: true }
      - { text: "One sequence is never a valid test; the agent needed at least a hundred", misconception: "One sequence can be a valid test of what it contains, and there is no magic count. Its weakness is what it leaves out." }
      - { text: "The agent should have written the script in a faster language than Python", misconception: "The language is not the issue. The test data did not cover the cases that fail." }
      - { text: "The test passed only because seq1 was short; longer sequences always fail", misconception: "Length is not the trigger. Lowercase bases and N are, and they can appear in short sequences too." }
  - type: order
    prompt: "Put the verification routine in order."
    explain: "Decide what correct looks like with something independent first, then compare, then fix, then keep the failing case as a permanent test."
    items:
      - "Run the script on a tiny input"
      - "Compute the expected values with an independent method"
      - "Compare every row, not just the first"
      - "Investigate each mismatch"
      - "Keep the failing case as a permanent test"
    why:
      "Compute the expected values with an independent method": "Run the script first, then get your own answer, so you know what to compare against."
      "Compare every row, not just the first": "You need both answers before you can compare them."
      "Investigate each mismatch": "Compare before you investigate, or you do not know what to look at."
      "Keep the failing case as a permanent test": "Keep the failing case after you understand it, so it stays caught."
      "Run the script on a tiny input": "Everything else needs a result to check."
  - type: sort
    prompt: "Which checks would have caught the lowercase bug?"
    bins: ["Catches it", "Misses it"]
    explain: "A check catches a bug only if it uses data that triggers it and an answer the buggy code did not produce."
    items:
      - { text: "Compare against the independent shell count on every sequence", bin: "Catches it", misconception: "seq2 differs between the two methods, so this surfaces it." }
      - { text: "Ask the agent 'is gc.py correct?'", bin: "Misses it", misconception: "The agent already believed its script was correct. Asking again produces the same belief." }
      - { text: "Test only on seq1", bin: "Misses it", misconception: "seq1 is uppercase and has no N, so the buggy code passes it." }
      - { text: "Add a soft-masked sequence to the test data", bin: "Catches it", misconception: "A lowercase case is exactly what triggers the bug." }
  - type: choice
    prompt: "An agent helped gather references for a manuscript. Which practice from the AI for Science draft protects you best?"
    explain: "Confirm that the DOI resolves, then build the reference from it with a deterministic tool, so a model does not write the reference text and a machine can check it. Disclose the agent's role where results are published."
    options:
      - { text: "Confirm each DOI, build the reference with a tool, and note the agent's role", correct: true }
      - { text: "Let the model format every reference from memory and skim the list", misconception: "Models can produce plausible references that do not exist. Skimming rarely catches them." }
      - { text: "Ask the model whether its references are real and keep the confirmed ones", misconception: "The model's own confirmation is not an independent check." }
      - { text: "Leave the agent out of the methods, since the references are checked", misconception: "The draft says to disclose agent use where results are published, even when you checked the output." }
