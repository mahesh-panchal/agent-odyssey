pass: 0.8
questions:
  - type: sort
    prompt: "Where does each item belong? Pick the one place that fits best."
    bins: ["Instructions file", "Auto memory", "Handoff note", "Git history"]
    explain: "The instructions file holds stable rules you write. Auto memory holds notes the tool wrote itself. A handoff note holds the state of one task (what failed, what is next). Git history holds the commits and their messages."
    items:
      - { text: "Never edit files under raw_data/", bin: "Instructions file", misconception: "A standing rule that applies to every session belongs in the file you write and load each time, not in a note about one task." }
      - { text: "A line the tool saved itself after you corrected a column name twice", bin: "Auto memory", misconception: "You did not write it and the tool decided to keep it, which is what makes it auto memory, not an instructions file." }
      - { text: "Tried a trim at Q15, it dropped 40% of reads, do not retry", bin: "Handoff note", misconception: "This is the state of one task and tells the next session what not to repeat. It is not a standing rule for all work." }
      - { text: "Commit message: qc: vectorise the mean-quality calculation", bin: "Git history", misconception: "A commit message is stored with the commit, in the repository history, not in a notes file." }
      - { text: "Next step: rerun the filter on batch 2 with the new threshold", bin: "Handoff note", misconception: "A next step is only true until it is done. A stable instructions file would soon be wrong if it held it." }
  - type: faulty-line
    prompt: "Lines from a handoff note written at the end of a session. Which line overstates what was verified?"
    explain: "A claim of verification must say what was run and on what. This line says every sample matched but admits one was run. The next session would trust it and skip the check."
    lines:
      - { text: "Goal: replace the per-read loop in qc_filter.py with a vectorised version", why: "A plain statement of intent, not a claim about results." }
      - { text: "Verified: output matches the old script on every sample (only sample_A was run)", faulty: true }
      - { text: "Not verified: behaviour on reads shorter than 30 bases", why: "It says openly what was not checked." }
      - { text: "Decision: keep the old function as qc_filter_old until all samples are compared", why: "It records a decision and the condition for dropping it." }
  - type: choice
    prompt: "The agent drafted your handoff note and wrote: 'All tests pass.' You did not see it run them. What do you do before giving the note to a fresh session?"
    explain: "A drafted note can overstate what was checked. Run the tests yourself, or edit the line to say what was actually run. Then the next session starts from a true statement."
    options:
      - { text: "Run the tests, then fix the line to match the result", correct: true }
      - { text: "Keep it, since the agent wrote it with the whole session in view", misconception: "Having seen the session does not mean it checked; models can state more certainty than the work supports." }
      - { text: "Delete the note and let auto memory carry the state", misconception: "Auto memory is not a record of task state; the tool chooses what to save and it may have saved nothing." }
      - { text: "Ask the agent in the same session if it is sure", misconception: "A confident yes is not a check. It is the same writer repeating itself." }
  - type: choice
    prompt: "A fresh session starts with your handoff note in the repo. Which first prompt gives you a check on its understanding?"
    explain: "Asking for a restatement before any change lets you compare it with the real state, an independent check, as in Ground Truth. Starting work at once hides any misunderstanding inside new edits."
    options:
      - { text: "Read HANDOFF.md and tell me what you understand before editing", correct: true }
      - { text: "Read HANDOFF.md and then carry out the listed next steps in order", misconception: "A misreading of the note would then show up only as wrong edits, after the damage is done." }
      - { text: "Continue where we stopped", misconception: "A fresh session has no history, so the agent has nothing to continue from and may invent it." }
      - { text: "Summarise what you remember of yesterday's session with me", misconception: "A fresh session does not have yesterday's session; it can only guess." }
  - type: match
    prompt: "Match each item to what it is."
    explain: "These four carry knowledge across the gap in different ways, with different authors and different trust."
    pairs:
      - { left: "Instructions file (CLAUDE.md)", right: "Stable rules you write, loaded every session", misconception: "You write it. Notes the tool writes itself are auto memory." }
      - { left: "Auto memory", right: "Notes the tool writes itself, readable with /memory", misconception: "It is not something you edit as a rule file; it can contain mistakes you never saw." }
      - { left: "Handoff note", right: "A short file on one task's state and next steps", misconception: "It is general practice, not a feature of the tool, and it is not loaded unless you point to it." }
      - { left: "Git history", right: "Commits and messages recording what changed", misconception: "It records changes to files, not what you or the agent were thinking." }
