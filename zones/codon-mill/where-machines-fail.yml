pass: 0.8
questions:
  - type: choice
    prompt: "A model says banana has three n. What is the best reading of that, and the best next step?"
    explain: "Letter counts can be wrong, even confidently, and tokenisation is a leading but debated explanation. The fix does not depend on settling the cause: run a script and read its output."
    options:
      - { text: "Counting letters is script work: run grep -o n | wc -l", correct: true }
      - { text: "Ask again with a longer prompt, since one more try settles it", misconception: "Repeating a question leaves the count a guess, and a script makes it exact." }
      - { text: "The model is lying on purpose, so stop using it for any task", misconception: "This is a limit of the model. Models remain useful for checkable jobs such as drafting." }
      - { text: "Switch to a word with fewer letters until the count is right", misconception: "That hides the weakness. Counting is a script job whatever the word." }
  - type: sort
    prompt: "Which jobs suit a model you can check, and which are better done by a script?"
    bins: ["Model, then check", "Script"]
    explain: "Summaries, drafts and explanations can be read and judged. Exact counts, sums and statistics should come from code that you can re-run."
    items:
      - { text: "Summarise a methods paragraph", bin: "Model, then check", misconception: "A summary can be checked against the source. Spot-check it." }
      - { text: "Count records in a FASTA file", bin: "Script", misconception: "grep -c '>' is exact and instant. Reading the file gives a guess." }
      - { text: "Draft a README for your pipeline", bin: "Model, then check", misconception: "Drafting is language work and you can read the result." }
      - { text: "Compute a p-value", bin: "Script", misconception: "A statistic needs a library and visible code." }
      - { text: "Explain an error message", bin: "Model, then check", misconception: "You can test the explanation by trying the suggested fix." }
      - { text: "Sum the read lengths", bin: "Script", misconception: "Summing many numbers is arithmetic, which is a script job." }
  - type: match
    prompt: "Match each failure mode to a fitting mitigation."
    explain: "Each mitigation targets the mechanism: lookups catch invented IDs, treating fetched text as data limits injection, a short file with a hook holds rules, and keeping the script is what is reproducible (general practice: non-determinism is not confirmed in the official docs)."
    pairs:
      - { left: "Hallucinated citation", right: "Look up every DOI or ID in PubMed", misconception: "A lookup confirms an ID exists, and rerunning the prompt cannot." }
      - { left: "Prompt injection", right: "Treat fetched files and pages as data", misconception: "An attacker's text stays unsafe however politely the system prompt is worded." }
      - { left: "Forgotten early instruction", right: "Short instructions file plus a hook", misconception: "Repeating it in chat is the thing that gets lost to compaction." }
      - { left: "Different answer each run", right: "Keep the script it wrote", misconception: "The script is the reproducible method." }
  - type: faulty-line
    prompt: "A plan for finding how many sequences a FASTA file has. Which line is the weakest?"
    explain: "A count stated in prose from reading the file is a guess, however sure it sounds. A command gives an exact number you can re-run."
    lines:
      - { text: "Have the agent run grep -c '>' on the file", why: "Each record has one header line, so the count is exact." }
      - { text: "Show me the command and its printed output", why: "You can read both and check them." }
      - { text: "Accept the number the model reads off the file if it sounds sure", faulty: true }
      - { text: "Cross-check with seqkit stats on the same file", why: "An independent second tool is a cheap check." }
  - type: order
    prompt: "Put these steps in order for an exact count that matters."
    explain: "Decide first whether the job needs exactness. Then have the script written, read it before running, and check the output. Recording the command and output comes last, once the output has been checked."
    items:
      - "Decide that the answer must be exact and can be computed"
      - "Ask the agent to write a command or script for it"
      - "Read the command before it runs"
      - "Run it and read the printed output"
      - "After the output is checked, record the command and output"
