questions:
  - type: choice
    prompt: "An agent produced a 1,500-line change for you. A collaborator who does not use LLMs will review it. What do you do?"
    explain: "The sender carries the cost of making work reviewable. Splitting and self-review are part of the job."
    options:
      - { text: "Read it yourself, split it up, say where the LLM helped, and include evidence", correct: true }
      - { text: "Send it as one change with a short summary and ask them to flag problems", misconception: "That moves your review work onto them." }
  - type: sort
    prompt: "Sort each action by what it does to your reviewer."
    bins: ["Eases the review", "Adds burden"]
    explain: "Reviewers need small units, context and evidence."
    items:
      - { text: "One idea per pull request", bin: "Eases the review", misconception: "Small focused changes are quick to review properly." }
      - { text: "Leaving out which parts an LLM helped with", bin: "Adds burden", misconception: "Reviewers cannot focus their attention if they do not know where to look." }
      - { text: "Including the test you ran and its output", bin: "Eases the review", misconception: "Evidence lets the reviewer verify instead of guess." }
  - type: choice
    prompt: "A collaborator does not use LLMs and is uneasy that you do. Which response respects them?"
    explain: "Respecting a collaborator means letting them keep their own tools and making your work easy to check."
    options:
      - { text: "Say when you used one and make your changes reviewable without any tool", correct: true }
      - { text: "Keep encouraging them to try it, so they can see for themselves how it helps", misconception: "Pressuring someone to adopt a tool makes collaboration worse." }
      - { text: "Use it quietly and only mention it if they ask you about it directly", misconception: "Hiding it removes their ability to judge the work properly." }
  - type: choice
    prompt: "You cannot explain a block of generated code in your own change. What now?"
    explain: "If you cannot explain it, you cannot vouch for it. Understand it, simplify it, or leave it out."
    options:
      - { text: "Understand it or replace it before sending, since you vouch for it", correct: true }
      - { text: "Send it, with a clear note that the LLM wrote that particular block", misconception: "Disclosure is good but does not remove your responsibility for the content." }
      - { text: "Send it and ask the reviewer to say whether it looks right to them", misconception: "This hands the reviewer the understanding work you skipped." }
  - type: choice
    prompt: "A colleague hints that using an agent makes your work unoriginal. What helps most?"
    explain: "Plain disclosure and visible checks let people judge the work on its evidence."
    options:
      - { text: "Say what the agent did, show what you checked, and follow your team's norm", correct: true }
      - { text: "Leave the agent out of any note and hope nobody asks about it", misconception: "Hiding it invites the suspicion you want to avoid and removes the reader's ability to judge the work." }
      - { text: "Argue that every serious group already uses agents and should say nothing", misconception: "Your team and venue set the norm. A general claim about other groups does not settle it." }
      - { text: "Write a long apology at the top of every document you share", misconception: "An apology signals doubt without telling readers what was done or checked." }
