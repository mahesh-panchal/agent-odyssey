pass: 0.8
questions:
  - type: choice
    prompt: "You change one number in a notebook cell and re-run it. Why does git show many changed lines?"
    explain: "A notebook is one JSON file that stores source, execution counts, outputs and embedded images together, and a re-run changes all of them."
    options:
      - { text: "Outputs and counters are stored beside the code and a re-run rewrites them", correct: true }
      - { text: "Notebooks are saved as one long line of JSON, so any change shows as the whole file", misconception: "The notebook spans many lines, and the diff above shows only four changed spots. Git compares line by line, so the problem is how much a re-run rewrites." }
      - { text: "Jupyter rewrites the source of every cell each time it saves", misconception: "Source of cells you did not touch is saved as written. The extra lines come from the cell you ran: its counter, text output and images." }
      - { text: "Re-running a cell moves it to the end of the cells list, so git sees it as moved", misconception: "Cells keep their position in the `cells` list when run. The noise comes from the counter, outputs and images rewritten in place." }
  - type: sort
    prompt: "Sort these lines of a notebook diff by whether a reviewer needs to read them."
    bins: ["Review this", "Regenerate, do not review"]
    explain: "The author's source is what you approve. Counters, printed results and image blobs come from a run and can be regenerated."
    items:
      - { text: "- print(len([r for r in reads if r >= 30]))", bin: "Review this", misconception: "This is changed source code, which is exactly what review is for." }
      - { text: "+ \"execution_count\": 7,", bin: "Regenerate, do not review", misconception: "A run counter says nothing about whether the code is right." }
      - { text: "+ \"image/png\": \"AAMGCQwPEhUYGx4hJCcqLTAz...\"", bin: "Regenerate, do not review", misconception: "An encoded image is output. Check the code that makes it, not the bytes." }
      - { text: "+ threshold = 40", bin: "Review this", misconception: "A changed parameter changes the result, so it needs a reviewer." }
  - type: order
    prompt: "Put a sensible review of a notebook change in order."
    explain: "Check the size of the change first, then read the source diff, then regenerate the outputs and use those over the stored ones."
    items:
      - "Run git diff --stat and look for a huge notebook"
      - "Read the diff of the source cells only"
      - "Question any changed parameter or cutoff you found in that diff"
      - "Re-run the notebook and compare its fresh outputs with what you expected from the questioned changes"
    why:
      "Run git diff --stat and look for a huge notebook": "Check the size of the change first to see whether outputs are swamping the code."
      "Read the diff of the source cells only": "Once you know the shape of the change, read the code that changed."
      "Question any changed parameter or cutoff you found in that diff": "Parameters need a reason, so ask after you have read the code."
      "Re-run the notebook and compare its fresh outputs with what you expected from the questioned changes": "Regenerate outputs last, once you know what the code is meant to do and what you expect."
