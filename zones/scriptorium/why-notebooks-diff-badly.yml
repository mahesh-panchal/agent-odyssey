pass: 0.8
questions:
  - type: choice
    prompt: "You change one number in a notebook cell and re-run it. Why does git show many changed lines?"
    explain: "A notebook is one JSON file that stores source, execution counts, outputs and embedded images together, and a re-run changes all of them."
    options:
      - { text: "Outputs and counters are stored beside the code and a re-run rewrites them", correct: true }
      - { text: "Git cannot compare JSON files properly, so it marks every line of the file as changed", misconception: "Git compares any text file line by line. JSON is fine; the problem is how much of it a re-run rewrites." }
      - { text: "Jupyter reformats the whole notebook each time it saves the file to disk", misconception: "The unchanged cells stay as they were. The extra lines come from the cell you ran: its counter, text output and images." }
      - { text: "Notebook cells are stored in a random order, so git sees every cell as moved", misconception: "Cells keep their order in the `cells` list. Moves are not the source of the noise." }
  - type: sort
    prompt: "Sort these lines of a notebook diff by whether a reviewer needs to read them."
    bins: ["Review this", "Regenerate, do not review"]
    explain: "The author's source is what you approve. Counters, printed results and image blobs come from a run and can be regenerated."
    items:
      - { text: "- print(len([r for r in reads if r >= 30]))", bin: "Review this", misconception: "This is changed source code, which is exactly what review is for." }
      - { text: "+ \"execution_count\": 7,", bin: "Regenerate, do not review", misconception: "A run counter says nothing about whether the code is right." }
      - { text: "+ \"image/png\": \"AAMGCQwPEhUYGx4hJCcqLTAz...\"", bin: "Regenerate, do not review", misconception: "An encoded image is output. Check the code that makes it, not the bytes." }
      - { text: "+ threshold = 40", bin: "Review this", misconception: "A changed parameter changes the result, so it needs a reviewer." }
  - type: match
    prompt: "Match each tool to what it does for notebook review."
    explain: "Each tool moves the noise somewhere else: out of git, into a second file, into a viewer, or out of the format."
    pairs:
      - { left: "nbstripout", right: "Strips outputs before git stores the notebook", misconception: "nbstripout cleans what git sees; it does not pair files or render diffs." }
      - { left: "jupytext", right: "Pairs the notebook with a plain .py file", misconception: "jupytext gives you a text version of the notebook to diff, with outputs staying in the .ipynb." }
      - { left: "nbdime", right: "Shows a notebook-aware diff and merge", misconception: "nbdime reads the notebook structure when diffing; it does not change what is stored." }
      - { left: "marimo", right: "A notebook tool that saves pure Python", misconception: "marimo stores notebooks as .py itself, so there is no JSON to strip." }
  - type: choice
    prompt: "A team adopts nbstripout. A new collaborator clones the repository and starts committing notebooks. What is true?"
    explain: "Git cannot install filters on clone, so every collaborator has to set nbstripout up. Otherwise their commits may still contain outputs."
    options:
      - { text: "They must run the setup themselves, because git does not install filters on clone", correct: true }
      - { text: "The filter arrives with the repository, so their commits are stripped automatically", misconception: "Filters are configured in each local clone. Committing a setup does not turn it on for others." }
      - { text: "Their notebooks lose all outputs on disk as soon as they clone", misconception: "nbstripout cleans what git stores. Outputs remain in the working file you edit." }
      - { text: "Only the person who first installed it can commit notebooks to the project", misconception: "Anyone can commit; the issue is whether their own clone has the filter set up." }
  - type: order
    prompt: "Put a sensible review of a notebook change in order."
    explain: "Check the size of the change first, then read the source diff, then regenerate the outputs rather than trusting the stored ones."
    items:
      - "Run git diff --stat and look for a huge notebook"
      - "Read the diff of the source cells only"
      - "Question any changed parameter or cutoff"
      - "Re-run the notebook to regenerate the outputs"
    why:
      "Run git diff --stat and look for a huge notebook": "Check the size of the change first to see whether outputs are swamping the code."
      "Read the diff of the source cells only": "Once you know the shape of the change, read the code that changed."
      "Question any changed parameter or cutoff": "Parameters need a reason, so ask after you have read the code."
      "Re-run the notebook to regenerate the outputs": "Regenerate outputs last, once you know what the code is meant to do."
