pass: 0.8
questions:
  - type: choice
    prompt: "Your CLAUDE.md says 'never delete files'. What does that guarantee?"
    explain: "The file is context the model reads. The tool's permissions stay as they are. Permission rules or hooks enforce."
    options:
      - { text: "Nothing: it is context for the model. Permission rules or hooks enforce", correct: true }
      - { text: "Claude Code will refuse every delete command while the rule is present", misconception: "Instruction files guide the agent. Deny rules enforce." }
      - { text: "Deletes will need your approval, because the rule makes the agent ask first", misconception: "The file leaves permission prompts as they are, and the agent can decide a guideline does not apply, so permission settings handle approval." }
  - type: sort
    prompt: "Which belong in a project instructions file?"
    bins: ["Belongs", "Leave out"]
    explain: "Keep what the agent cannot guess and what stays true. Leave out secrets and long prose."
    items:
      - { text: "The command that runs the test suite", bin: "Belongs", misconception: "A command the agent cannot guess is ideal content." }
      - { text: "Your API key", bin: "Leave out", misconception: "Secrets stay out of a file that is read and often committed." }
      - { text: "'raw/ is read-only data. Never edit it.'", bin: "Belongs", misconception: "A boundary the agent should know, though enforce it with a deny rule too." }
      - { text: "A 40-page methods description", bin: "Leave out", misconception: "Long instructions are followed less well and fill the context." }
  - type: match
    prompt: "Match each tool or scope to its instructions file."
    pairs:
      - { left: "Claude Code, project", right: "CLAUDE.md in the project", misconception: "Claude Code reads CLAUDE.md." }
      - { left: "OpenCode, project", right: "AGENTS.md in the project root", misconception: "OpenCode reads AGENTS.md, falling back to CLAUDE.md." }
      - { left: "Claude Code, only you, uncommitted", right: "CLAUDE.local.md", misconception: "The local variant is for personal, uncommitted notes." }
      - { left: "Generate a first draft", right: "/init", misconception: "/init drafts the file in both tools." }
    explain: "Each tool has its own project file, and both can draft one with /init."
  - type: choice
    prompt: "/init wrote an instructions file for you. What should you do?"
    explain: "A generated file is a draft. It can contain wrong guesses about how your project works."
    options:
      - { text: "Read it critically and fix it before relying on it", correct: true }
      - { text: "Trust it as written, since the agent read the project", misconception: "It inferred the project from files and may have guessed wrong." }
      - { text: "Delete it, since instruction files rarely help anyone", misconception: "A short, correct file saves repeated explanation." }
  - type: choice
    prompt: "Two of your instruction files give conflicting advice about the test command. What does `/doctor prompt-audit` do about it?"
    explain: "It flags outdated or conflicting content in a report with proposed edits and changes nothing until you ask. It checks content only, and its suggestions come from a model, so you still review them."
    options:
      - { text: "Reports the conflict with proposed edits, and changes nothing until you ask", correct: true }
      - { text: "Rewrites both files at once to remove the conflict", misconception: "The audit proposes edits. Nothing in your files changes until you ask Claude to apply them." }
      - { text: "Measures how many tokens the files use and trims the longest", misconception: "It checks for outdated or conflicting instructions; size and cost are outside its scope." }
      - { text: "Does nothing, because the model resolves conflicts reliably on its own", misconception: "The docs say Claude may pick one conflicting instruction arbitrarily, which is why an audit is useful." }
  - type: choice
    prompt: "A parameter was renamed but its docstring was not, so an agent called the old name. Which habit helps most?"
    explain: "Agents work from docstrings and descriptions, so keep them current and put units, data versions and assumptions in them."
    options:
      - { text: "Keep docstrings current, with units, versions and assumptions", correct: true }
      - { text: "Add a line to the instructions file saying never to rename parameters", misconception: "Instructions are advice, and renaming is sometimes the right change." }
      - { text: "Rely on the agent to read the code and ignore the docstrings", misconception: "Agents lean on docstrings and descriptions, and they cannot be relied on to notice a mismatch." }
      - { text: "Write a longer prompt each time that describes every parameter", misconception: "That repeats work and goes stale, while the docstring stays with the code." }
