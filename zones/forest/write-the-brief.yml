pass: 0.8
questions:
  - type: sort
    prompt: "Sort each prompt by whether it gives the agent something checkable."
    bins: ["Checkable", "Vague"]
    explain: "A checkable prompt names the target and a test of success. A vague one leaves the agent guessing what 'good' means."
    items:
      - { text: "Make the script better.", bin: "Vague", misconception: "'Better' has no test. The agent will pick its own meaning." }
      - { text: "Add a test for empty input to parse.py and make it pass without changing existing tests.", bin: "Checkable", misconception: "It names a file, a case and a pass condition." }
      - { text: "Clean up my analysis.", bin: "Vague", misconception: "Nothing says what to keep, change or leave alone." }
      - { text: "The output has 41 rows but the input has 42. Find where one is dropped. Show the command that proves it.", bin: "Checkable", misconception: "A concrete symptom plus a request for evidence." }
  - type: choice
    prompt: "What does plan mode give you in Claude Code?"
    explain: "The agent researches and proposes a plan, and makes no source edits until you approve."
    options:
      - { text: "A plan to review before any source edits happen", correct: true }
      - { text: "A guarantee that the plan is correct", misconception: "A plan can be wrong. Plan mode gives you a chance to catch that before changes." }
      - { text: "Faster output", misconception: "Plan mode is about control, not speed." }
  - type: order
    prompt: "Put this working loop in order."
    items:
      - "State the symptom and what done looks like"
      - "Ask for a plan, with no edits yet"
      - "Read and correct the plan"
      - "Let it implement in small steps"
      - "Run the check yourself"
    why:
      "Ask for a plan, with no edits yet": "You cannot review a plan that does not exist yet, and edits come after approval."
  - type: choice
    prompt: "You finish one task and start an unrelated one in the same long session. What is the sensible move?"
    explain: "Starting fresh avoids carrying irrelevant context. The docs describe clearing for exactly this."
    options:
      - { text: "Clear or start a new session for the new task", correct: true }
      - { text: "Keep going so the agent remembers everything", misconception: "Old, unrelated material can crowd out what matters now." }
      - { text: "Repeat the whole old conversation in the new prompt", misconception: "That carries the same clutter into the new task." }
  - type: choice
    prompt: "Which request best asks the agent for evidence?"
    explain: "A command and its output are something you can inspect or re-run."
    options:
      - { text: "Show the command you ran and its output", correct: true }
      - { text: "Tell me you are confident", misconception: "Stated confidence is not an observation." }
      - { text: "Say that it works", misconception: "A claim is not evidence." }
