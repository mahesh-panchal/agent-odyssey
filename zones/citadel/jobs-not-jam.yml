pass: 0.8
questions:
  - type: sort
    prompt: "Sort each Slurm command into the permission bin a cautious setup would give it."
    explain: "Read-only status commands can be allowed. Commands that spend resources or end jobs ask. Cancelling every one of your jobs is denied. A single ask rule on scancel * is the net for the other bulk selectors."
    bins: ["allow", "ask", "deny"]
    items:
      - { text: "squeue --user=$USER", bin: "allow", misconception: "It only reports job state, so prompting for each call would train you to click yes without reading." }
      - { text: "sacct for a finished job", bin: "allow", misconception: "It only reads accounting records. It changes nothing." }
      - { text: "sbatch run_alignment.sh", bin: "ask", misconception: "Submitting spends shared resources, so you want to read the script and resources each time. Allowing it silently hands that decision to the agent." }
      - { text: "scancel 123456", bin: "ask", misconception: "Cancelling one named job is legitimate but destructive, so ask lets you decide each time." }
      - { text: "scancel --user=your-username", bin: "deny", misconception: "This signals all your jobs, including ones the agent did not start. It belongs in deny." }
  - type: choice
    prompt: "You have `Bash(scancel -u *)` in `deny`. How far can you rely on it to protect your other jobs?"
    explain: "Bash rules are not a security boundary, so a differently spelled command (scancel --me, --name, --state, --partition) can slip past. A single ask rule on scancel * is the net. For enforcement use a PreToolUse hook; the sandbox limits files and network, not Slurm commands."
    options:
      - { text: "Partly: a rewritten command can slip past the pattern", correct: true }
      - { text: "Fully, because deny rules are checked before any other rule", misconception: "Deny does come first in order, but the pattern still has to match the command that actually runs." }
      - { text: "Fully, provided the rule is in the user settings file", misconception: "File location sets scope and leaves strength unchanged. The matching limitation applies everywhere." }
      - { text: "Not at all, because deny only matches the first command of a compound line", misconception: "Ask and deny rules apply to every part of a compound command. The weakness is differently spelled commands, and a compound line changes nothing." }
  - type: choice
    prompt: "An agent is told to `/loop` a `squeue` check every 30 seconds for an overnight run. What is the main problem?"
    explain: "Each firing sends the full context again and keeps spending tokens, even when the session is idle. A sleep-style loop at that rate also hits the scheduler, so prefer sbatch --wait or a poll about once a minute."
    options:
      - { text: "Every poll resends the whole conversation and costs tokens", correct: true }
      - { text: "Slurm refuses squeue calls more often than once a minute", misconception: "Slurm can rate-limit sustained high request rates per user, but there is no such fixed limit. The main problem here is the token cost of each poll." }
      - { text: "Loops only fire while you are watching the session, so the run is not monitored", misconception: "Scheduled tasks fire on their interval even while the session is idle. That is exactly why they keep spending." }
      - { text: "The squeue output is too long to fit in the context window", misconception: "The cost comes from resending the whole conversation with every poll, whatever the size of one squeue listing." }
  - type: choice
    prompt: "An agent submitted a job with `sbatch --parsable --wait`, and the agent's tool call timed out after ten minutes. What should it do?"
    explain: "The job is probably still running, so resubmitting would duplicate it. State from sacct is the evidence. Also, --wait passes the job's exit code through, but a signal-killed job gives 1."
    options:
      - { text: "Check State with sacct --jobs=<id> before doing anything else", correct: true }
      - { text: "Submit the job again, because the first wait failed on its own", misconception: "A timed-out wait is the tool's limit, not the job failing. A resubmit runs the work twice on shared resources." }
      - { text: "Poll squeue every few seconds until the job leaves the queue", misconception: "Tight polling loads the scheduler. Poll about once a minute at most, scoped to the job, or wait in the background." }
      - { text: "Treat it as success, because sbatch exited without an error message", misconception: "The wait never returned, so there is no exit code. Even a returned code is weak proof: confirm State with sacct." }
  - type: faulty-line
    prompt: "A teaching permission block for a cluster project. Which line breaks the intended split between agent and human?"
    explain: "Allowing sbatch means the agent can submit jobs without asking you. Submission should be in ask."
    lines:
      - { text: '{', why: "Opens the file." }
      - { text: '  "permissions": {', why: "Opens the permissions block." }
      - { text: '    "allow": ["Bash(squeue *)", "Bash(sinfo *)", "Bash(sbatch *)"],', faulty: true }
      - { text: '    "ask":   ["Bash(srun *)", "Bash(salloc *)", "Bash(scancel *)"],', why: "These spend resources or end jobs, so you decide each time." }
      - { text: '    "deny":  ["Bash(scancel -u *)"]', why: "Blocks the bulk-cancel form. The ask rule above is the net for other selectors." }
      - { text: '  }', why: "Closes the block." }
      - { text: '}', why: "Closes the file." }
  - type: match
    prompt: "Match each OpenCode or Claude Code behaviour to the setting that follows from it."
    explain: "Know each tool's default, then add the rule that makes sbatch ask. Rules are a prompt, and a hook is what enforces."
    pairs:
      - { left: "Claude Code: make sbatch prompt every time", right: "Put Bash(sbatch *) in ask", misconception: "Ask rules force a prompt, even when a narrower allow rule exists." }
      - { left: "OpenCode V2: sbatch runs without a prompt", right: "The base policy begins with an allow-all rule, so add an ask rule", misconception: "An unmatched action asks, but per the docs the base policy starts with allow-all, so an explicit ask rule for sbatch is likely needed." }
      - { left: "Enforcing a rule beyond Bash matching", right: "A PreToolUse hook", misconception: "Bash rules are not a security boundary, so enforcement needs a hook. The sandbox limits files and network, not Slurm commands." }
