questions:
  - type: order
    prompt: "Put the first-contact steps in the safest order."
    explain: "Install, verify, enter a throwaway folder, then start the agent: each step makes the next one safer."
    items:
      - "Run the installer"
      - "Confirm the version (claude --version or opencode --version)"
      - "cd into an empty scratch folder"
      - "Start the agent with edits off (plan mode or the plan agent)"
    why:
      "Confirm the version (claude --version or opencode --version)": "Install first, then confirm; a version cannot be checked until something is installed."
      "cd into an empty scratch folder": "Move into the scratch folder after the install is confirmed and before you start the agent."
      "Start the agent with edits off (plan mode or the plan agent)": "Start the agent last, after you are standing in a throwaway folder."
      "Run the installer": "The installer comes first; everything else depends on it."
  - type: choice
    prompt: "After installing your agent, the shell says `command not found` when you type its name. What is the most likely cause?"
    explain: "The shell searches only the folders on its PATH, and an open terminal may predate the install. Add the folder to PATH or open a new terminal."
    options:
      - { text: "The shell cannot see the folder that holds the program, so it is not on PATH yet or the terminal is older than the install", correct: true }
      - { text: "Your login or API key has expired, so the shell blocks the program", misconception: "Login happens after the program starts. A 'command not found' means the shell cannot find the program at all." }
      - { text: "The agent needs a model pulled or a plan chosen before the command exists", misconception: "The model or plan is needed after the program starts, not for the shell to find it." }
      - { text: "The scratch folder is missing, so the command cannot be found", misconception: "The program lives where the installer put it. The current folder does not decide whether the shell finds it." }
  - type: choice
    prompt: "Why does the first session run in a throwaway folder with edits switched off?"
    explain: "An agent can read your files and run commands. A scratch folder and a mode that plans without editing keep the first session harmless while you learn what it does."
    options:
      - { text: "The agent can read files and run commands, so the first session should be unable to change anything that matters", correct: true }
      - { text: "Edit mode does not work until you have run a first session", misconception: "Edits are available at once. You switch them off on purpose." }
      - { text: "A throwaway folder makes the model more accurate", misconception: "The folder changes what the agent can touch and has no effect on accuracy." }
      - { text: "Plan mode stops the agent from sending anything to the provider", misconception: "A hosted model still receives what it reads. Plan mode limits edits and does not change where prompts go." }
  - type: choice
    prompt: "Your first session answered a question about your folder. What should you do with the answer?"
    explain: "A hosted model and a small local model can both be wrong with confidence. Check what an agent hands back, and test a local model on questions whose answers you know."
    options:
      - { text: "Check it against the files, because either kind of model can be wrong", correct: true }
      - { text: "Trust it, because the agent read the files itself", misconception: "Reading files does not make a summary of them correct." }
      - { text: "Trust it if the model runs locally, because local models do not make mistakes", misconception: "A local model usually makes more mistakes than a hosted one." }
      - { text: "Trust it if it sounds confident", misconception: "Confidence is the problem. A wrong answer sounds as sure as a right one." }
  - type: faulty-line
    prompt: "Notes for a first session with a new agent. Which line is risky?"
    explain: "The first session belongs in a throwaway folder with no real or sensitive data, with edits switched off."
    lines:
      - { text: "1. Run the installer, then confirm the version number prints.", why: "Checking the version proves the install worked." }
      - { text: "2. Make an empty scratch folder and move into it.", why: "A throwaway folder limits what the agent can reach." }
      - { text: "3. Start the agent inside my real project folder to see what it does with my data.", faulty: true }
      - { text: "4. Ask it to list the files and say what it would do next, changing nothing.", why: "A read-only request is the right first test." }
