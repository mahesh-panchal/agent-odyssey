questions:
  - type: sort
    prompt: "A researcher plans six tasks. Sort them by whether real rows from the samples database would leave the machine."
    bins: ["No real rows leave", "Real rows would leave"]
    explain: "Text you type, schemas and invented rows keep real data home. Pasting, uploading or letting an agent read data sends it, even when the tool is read-only."
    items:
      - { text: "Ask for an outline and section headings for a quarterly report", bin: "No real rows leave", misconception: "A question with no data in it sends only the words you typed." }
      - { text: "Paste the schema and ask for a query that you run yourself", bin: "No real rows leave", misconception: "Table and column names travel and the rows stay on your machine, because you run the query." }
      - { text: "Ask how to explain a fall in sample numbers to a board", bin: "No real rows leave", misconception: "A general question needs no data, so nothing from the database is sent." }
      - { text: "Upload the whole sample table so the model can count by project", bin: "Real rows would leave", misconception: "An upload is sent to the provider like pasted text, however helpful the count is." }
      - { text: "Paste ten rows with participant codes to get counts by month", bin: "Real rows would leave", misconception: "Pasted rows are sent, and codes that replace names are still personal data." }
      - { text: "Let a read-only agent open the data folder and summarise it", bin: "Real rows would leave", misconception: "Read-only limits what the agent changes. It still sends what it reads." }
  - type: choice
    prompt: "An analyst runs an agent in plan mode on a copy of the database. What does the read-only part protect them from?"
    explain: "Plan mode limits what the agent does. Reading still happens, so the contents it reads are sent to the provider."
    options:
      - { text: "Edits to your files, while what the agent reads is still sent", correct: true }
      - { text: "Anything leaving the machine, because a read-only agent cannot write anything", misconception: "Read-only restricts actions. Reading is the step that sends data." }
      - { text: "Network use, because plan mode blocks calls to outside services", misconception: "Plan mode limits actions such as editing. It has no say over where the content it reads is sent." }
  - type: choice
    prompt: "You want tests for one function in a private pipeline repository that holds no personal data. What is the lowest step that does the job?"
    explain: "Pasting the one function is a small allowed extract (step 3), and you apply the tests yourself. Giving an agent edit rights is step 5, and uploading the repository sends everything in it."
    options:
      - { text: "Paste the one function and apply the tests yourself", correct: true }
      - { text: "Give an agent edit rights in the repository so it can run everything", misconception: "That is step 5, which hands over far more than the job needs. Work up to it only on a copy, with an undo and limits." }
      - { text: "Upload the whole repository so the model sees the full context", misconception: "Everything uploaded is sent. The task needs only one function." }
      - { text: "Use no LLM at all, since the code is private", misconception: "Step 0 is lower, and it does not do the job. A small allowed extract does, and the code holds no personal data." }
  - type: match
    prompt: "Match each step to what leaves your machine."
    explain: "The step sets what the tool can do, and what you type, paste, upload or let it read sets what leaves."
    pairs:
      - { left: "Chat with no data", right: "Only the words you type", misconception: "With no data in the prompt, only your own wording is sent." }
      - { left: "Chat with schema or headings and invented rows", right: "Names and headings, and the invented rows", misconception: "The shape of the data goes, and the real rows stay with you." }
      - { left: "Local model on the real data", right: "Nothing, unless a web or tool call sends something", misconception: "A local model keeps prompts home, and tools it calls may still reach out." }
      - { left: "Read-only agent on a copy", right: "Whatever files it reads", misconception: "A copy protects the original from edits, and the copy's contents are still sent when read." }
  - type: choice
    prompt: "The organisation pays for an organisation account. A colleague wants to use a personal Pro account for the same report data. What matters most?"
    explain: "The two kinds of account have different documented terms, such as the training setting and retention. Use the account your organisation approved for that data."
    options:
      - { text: "The terms may differ by account type, so use the approved one", correct: true }
      - { text: "The terms are the same, because both accounts talk to the same model", misconception: "Terms belong to the plan and the account type, and the model name does not decide them." }
      - { text: "A personal account is safer, because no administrator is involved in it", misconception: "Fewer people involved does not make an account approved for that data." }
  - type: choice
    prompt: "Which statement about incognito chats is correct?"
    explain: "Incognito chats are not used for training and are still kept for 30 days by default, so they are not a place for data that must never leave."
    options:
      - { text: "Not used for training, and still kept for 30 days by default", correct: true }
      - { text: "They leave nothing on the provider's side once the chat has ended", misconception: "The page gives a 30-day default retention." }
      - { text: "They are deleted from the provider as soon as the window closes", misconception: "Deletion takes up to 30 days, and flagged chats may be kept longer." }
  - type: choice
    prompt: "An archivist must clean a sample sheet with controlled health metadata. Which request keeps the real values at home?"
    explain: "Headings and invented rows that copy the mess are enough for a model to write a script. You run it on the real sheet, so the values never leave."
    options:
      - { text: "Describe the mess, give headings and invented rows, and run the script it writes yourself", correct: true }
      - { text: "Upload the whole sheet to the model and ask it to harmonise all the values in it", misconception: "An upload is sent to the provider, and a model asked to harmonise values can invent plausible ones." }
      - { text: "Paste the first ten rows to show it the problem, and keep the other rows back", misconception: "Those ten rows still leave, and the agreement forbids sharing the values." }
      - { text: "Ask it to fill in the missing metadata from whatever it can infer from the rest", misconception: "Inferred values are made up. The sheet needs a record of what each value really was." }
