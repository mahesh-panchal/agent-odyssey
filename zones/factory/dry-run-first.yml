pass: 0.8
questions:
  - type: order
    prompt: "Put the checks on agent-written pipeline code in order, cheapest first."
    items:
      - "Read the diff"
      - "Dry run or stub run"
      - "Run on a tiny real input"
      - "Compare with an independent check on that input"
      - "Run on real data"
    why:
      "Run on real data": "Real data and cluster time are the expensive step, so it comes after every cheap check."
  - type: choice
    prompt: "Your dry run lists every expected job and exits cleanly. What have you shown?"
    explain: "A dry run shows the plan. It does not run the commands."
    options:
      - { text: "The workflow manager could build a plan of which steps would run", correct: true }
      - { text: "Every tool command in the pipeline runs with valid flags and arguments", misconception: "No command was executed, so a wrong flag still passes a dry run." }
      - { text: "The outputs will be correct once you run it on the real data", misconception: "Nothing was computed, so nothing about the results has been tested." }
      - { text: "The pipeline will finish within the cluster time you plan to request", misconception: "A plan lists jobs but says nothing about how long they take." }
  - type: sort
    prompt: "Which problems can a dry run or stub run catch, and which not?"
    bins: ["Can catch", "Cannot catch"]
    explain: "These runs exercise the graph; checking the commands takes a real run."
    items:
      - { text: "A step needs an input that no step produces", bin: "Can catch", misconception: "Typically reported when the plan is built, though which errors appear is not guaranteed." }
      - { text: "A tool flag that silently changes the result", bin: "Cannot catch", misconception: "The command never runs, so its behaviour is untested." }
      - { text: "A process declares an output that its stub never creates", bin: "Can catch", misconception: "A stub run can expose a declared output that is not produced. A wrong but compatible connection can still pass, so read the plan too." }
      - { text: "Filtering that drops half the reads for the wrong reason", bin: "Cannot catch", misconception: "That needs a real run on a tiny input and a check on the result." }
  - type: choice
    prompt: "An agent says the new pipeline 'was tested'. Which follow-up is the most useful?"
    explain: "Ask what was run, on what input, and compared with what. Then repeat the cheap parts yourself."
    options:
      - { text: "Ask what was run, on which input, and what the output was compared with", correct: true }
      - { text: "Ask it to run the test suite it wrote and report whether everything passes", misconception: "Tests the agent wrote may only check what it already believes, and its report is still its own claim." }
      - { text: "Ask a second agent to review the pipeline and say if it looks correct", misconception: "A second opinion from a similar system is another claim, not an observation of a run." }
      - { text: "Look for a test file in the diff and treat it as proof of testing", misconception: "A test file existing does not show it was run, or that it checks anything meaningful." }
  - type: faulty-line
    prompt: "A Snakemake rule an agent wrote. Which line will cause the quiet failure?"
    explain: "The input is a hard-coded path, so every sample is silently computed from sample1.fa on a machine that has it, and the rule fails on machines without that path."
    lines:
      - { text: 'rule count_gc:', why: "The rule header." }
      - { text: '    input: "/home/anna/data/sample1.fa"', faulty: true }
      - { text: '    output: "results/{sample}.gc.txt"', why: "The output uses the sample wildcard." }
      - { text: '    shell: "python gc.py {input} > {output}"', why: "The command uses the declared input and output." }
  - type: faulty-line
    prompt: "A shell step in a pipeline. Which line is the most dangerous?"
    explain: "The shell empties the file before sort reads it, so the data is lost. Write to a new output path."
    lines:
      - { text: 'mkdir -p results', why: "Creating a results folder is harmless." }
      - { text: 'sort reads.txt > reads.txt', faulty: true }
      - { text: 'wc -l reads.txt', why: "Counting lines is read-only." }
  - type: sort
    prompt: "Sort each pipeline habit."
    bins: ["Reproducible", "Fragile"]
    explain: "Declared inputs and outputs and pinned environments repeat. Hidden state does not."
    items:
      - { text: "Every output is declared by the step that makes it", bin: "Reproducible", misconception: "Declared outputs let the manager track and re-run correctly." }
      - { text: "Tool versions are pinned in the environment file", bin: "Reproducible", misconception: "A pinned version gives the same tool version. Lock files pin the whole environment, including dependencies." }
      - { text: "The step reads a file from the author's home directory", bin: "Fragile", misconception: "It will fail or differ on any other machine." }
      - { text: "A step edits its input file in place", bin: "Fragile", misconception: "A re-run starts from altered data, and there is no way back." }
