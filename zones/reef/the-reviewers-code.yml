pass: 0.8
questions:
  - type: sort
    prompt: "Sort these review comments."
    bins: ["Helpful", "Unhelpful"]
    explain: "Helpful comments ask for evidence or action and focus on the work. Unhelpful ones are vague or personal."
    items:
      - { text: "Which test covers the empty-input case?", bin: "Helpful", misconception: "A specific request for evidence." }
      - { text: "This looks AI-generated, rejected.", bin: "Unhelpful", misconception: "Aim the comment at the work. Say what is wrong with it." }
      - { text: "This is too large to review properly. Could you split it by feature?", bin: "Helpful", misconception: "Asking for a reviewable size is legitimate and actionable." }
      - { text: "Are you sure?", bin: "Unhelpful", misconception: "It invites a reassurance, not evidence." }
  - type: choice
    prompt: "In a diff, a test's expected value changed from 60 to 20 in the same commit that fixed a function. What is the best reviewer response?"
    explain: "A test edited to match new output may mean the test was weakened to pass. Ask why the expected value changed."
    options:
      - { text: "Ask why the value changed and what shows 20 is correct", correct: true }
      - { text: "Approve, because the tests pass and the function was clearly fixed", misconception: "Tests that were edited to pass do not show the function is correct." }
      - { text: "Ask them to put the value back to 60, since tests must never be edited", misconception: "Tests can legitimately change when the expected behaviour changes. What matters is an independent reason for the new value." }
  - type: choice
    prompt: "A reviewer asks you to explain why a branch exists, and you cannot. What does that tell you?"
    explain: "A fair question that you cannot answer means you do not yet understand your own change."
    options:
      - { text: "You are not ready to send it, so go and understand or remove it", correct: true }
      - { text: "The reviewer is asking about something that does not matter much", misconception: "Explaining the reason for a line is an ordinary expectation of any author." }
      - { text: "It can stay, because the tests pass", misconception: "Passing tests do not explain why the code exists. Explaining the reason is an ordinary expectation of any author." }
