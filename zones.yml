# Overworld layout. Legend: . grass  = path  # tree  ~ water  o stone.  Gates are letters (see gates).
map:
  - "####################"
  - "#..F........~~~~...#"
  - "#..=.........~~~.=C#"
  - "#..=...K.....~~~.=.#"
  - "#..=...=.........=.#"
  - "#..=...=.........=M#"
  - "#..===============.#"
  - "#..=........=....=.#"
  - "#..B........=....=R#"
  - "#...........P......#"
  - "#..................#"
  - "####################"
start: B
prologue: >-
  A Blight is spreading: plausible but false knowledge that grows whenever nobody checks it. It seeps through
  careless copy-and-paste, unreviewed output, and answers nobody understood. The tools are not the enemy. Walk the land,
  recruit companions, build your immunity, and clear the Murk.
gates:
  B: { id: basecamp, name: "Basecamp at the Root",  track: "Prologue",   status: open,
       quests: [
         { id: basecamp-name-the-fears, title: "Name the Fears", page: zones/basecamp/name-the-fears.html,
           story: "The fire at Basecamp burns low. Around it sit the worries every traveller brings. Name each one, and it shrinks.",
           done: "Each fear has a name and a counter-habit. You travel knowing what you are guarding against." },
         { id: basecamp-three-kinds-of-machine, title: "Three Kinds of Machine", page: zones/basecamp/three-kinds-of-machine.html,
           story: "A workbench holds three machines: one that always repeats, one trained for a single task, one that talks.",
           done: "You can choose the right machine, and sometimes the right machine is a plain script." } ] }
  K: { id: kennel,   name: "The Kennel",            track: "Companions", status: open,
       quests: [
         { id: kennel-recruit-the-beast, title: "Recruit the Beast", page: zones/kennel/recruit-the-beast.html,
           story: "A great armoured beast sleeps in the Kennel, strong but unthinking. It will only follow someone who can set it up and keep it on a short lead.",
           done: "The Beast stirs and falls in beside you. It is powerful and will do exactly what its permissions allow." },
         { id: kennel-adopt-the-pet, title: "Adopt the Pet", page: zones/kennel/adopt-the-pet.html,
           story: "In a corner, a small pet blinks at you. It lives on your own machine, costs nothing to feed, and forgets things easily.",
           done: "The Pet curls up on your laptop. Small and local, it needs more room to think and a leash of its own." } ] }
  C: { id: crypt,    name: "Ancient DNA Crypt",     track: "Armour",     status: open,
       quests: [
         { id: crypt-shield-of-undo, title: "Shield of Undo", page: zones/crypt/shield-of-undo.html,
           story: "The Crypt door is sealed with Murk. A faded note reads: nothing here is safe to touch without a way back.",
           done: "The first seal cracks. You carry the Shield of Undo: any change can now be reversed." },
         { id: crypt-rules-of-the-carapace, title: "Rules of the Carapace", page: zones/crypt/rules-of-the-carapace.html,
           story: "Deeper in the Crypt, bare skin is not enough. You must grow a carapace: rules about what your companions may touch.",
           done: "A carapace hardens over you. Your companions can now only do what your rules allow." },
         { id: crypt-secrets-and-sensitive-ground, title: "Secrets and Sensitive Ground", page: zones/crypt/secrets-and-sensitive-ground.html,
           story: "In the deepest chamber lie sealed relics: keys, tokens and samples under special agreements. Not everything here may leave the room.",
           done: "Your visor closes. Keys and sensitive ground stay out of reach, and you know where the agreement lives." } ] }
  M: { id: maze,     name: "Sequence Maze",         track: "Trust",      status: open,
       quests: [
         { id: maze-spot-the-mirage, title: "Spot the Mirage", page: zones/maze/spot-the-mirage.html,
           story: "The maze walls shimmer. Some corridors are real and some are Mirages: things that look exactly right and do not exist.",
           done: "You can name the Mirage's tricks: invented functions, fake citations, confident nonsense." },
         { id: maze-ground-truth, title: "Ground Truth", page: zones/maze/ground-truth.html,
           story: "A glowing script claims to have been tested. Only an independent measurement can say whether it is telling the truth.",
           done: "You hold a lantern of ground truth: an independent check that does not trust the agent's word." },
         { id: maze-wall-of-output, title: "Boss: The Wall of Output", page: zones/maze/wall-of-output.html,
           story: "At the maze's heart rises a wall of text, thousands of lines high. It does not attack. It simply cannot be reviewed.",
           done: "The Wall crumbles into small, reviewable stones. You never had to read all of it, only to refuse it whole." } ] }
  F: { id: forest,   name: "Phylogenetic Forest",   track: "Skills",     status: open,
       quests: [
         { id: forest-write-the-brief, title: "Write the Brief", page: zones/forest/write-the-brief.html,
           story: "The first branch of the great tree is bare. A vague instruction leaves the sap to wander; a clear one makes the bark grow.",
           done: "The first branch buds: briefs with a target, a check, and a plan before the edits." },
         { id: forest-the-project-charter, title: "The Project Charter", page: zones/forest/the-project-charter.html,
           story: "A carved stone stands at the forest's heart, holding what every traveller should know. It advises. It cannot bind.",
           done: "A second branch: standing instructions that help, and a clear sense of why they do not enforce." },
         { id: forest-forge-a-skill, title: "Forge a Skill", page: zones/forest/forge-a-skill.html,
           story: "In a hollow, a smith keeps procedures in folders, taking each out only when it is needed.",
           done: "A third branch: a procedure packaged as a Skill, read before it is trusted." } ] }
  R: { id: reef,     name: "Biodiversity Reef",     track: "Level",      status: open,
       quests: [
         { id: reef-send-small-say-so, title: "Send Small, Say So", page: zones/reef/send-small-say-so.html,
           story: "A Review-leech clings to the reef, feeding on work passed to others unchecked. Tidy hand-offs starve it.",
           done: "You hand over small, honest, evidenced work. The leech goes hungry." },
         { id: reef-the-reviewers-code, title: "The Reviewer's Code", page: zones/reef/the-reviewers-code.html,
           story: "Now the work comes to you. Ask for evidence, not for stories, and be kind about it.",
           done: "You review the work, not the tool, and you ask for what can be checked." },
         { id: reef-teach-and-share-the-load, title: "Teach and Share the Load", page: zones/reef/teach-and-share-the-load.html,
           story: "A reef thrives on many hands. Teach what you know, protect what you are learning, and take on only what you can review.",
           done: "You teach the checks, guard your own learning, and keep your workload reviewable." } ] }
  P: { id: factory,  name: "Pipeline Factory",      track: "Craft",      status: soon,
       blurb: "Machines that run the same steps every time. Learn when an LLM belongs in them. (Not open yet.)" }
