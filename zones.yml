# Overworld layout. Legend: . grass  = path  # tree  ~ water  o stone.  Gates are letters (see gates).
map:
  - "####################"
  - "#..F=======~~~~~...#"
  - "#..=.........~~~.=C#"
  - "#..=...K.....~~~.=.#"
  - "#..=...=......====.#"
  - "#..=...===X......=M#"
  - "#..===============.#"
  - "#..=........=....=.#"
  - "#..B........=....=R#"
  - "#..=........P......#"
  - "#..===L.....=====H.#"
  - "####################"
start: B

# --- Path graph. Per quest: after = hard prerequisites (advice), suggested = soft; branch = trunk or a branch id below.
# Only the finale gate enforces anything. A branch is complete when all its non-optional quests are cleared.
trunk_order:
  - worries-name-the-fears
  - agents-and-models-script-model-or-llm
  - agents-and-models-know-your-tools
  - agents-and-models-choose-what-to-hand-over
  - safe-editing-save-point
  - agents-and-models-set-up-your-agent
  - safe-editing-test-permissions-and-the-sandbox
  - safe-editing-write-permission-rules
  - safe-editing-keep-secrets-out-of-reach
  - safe-editing-plan-before-you-edit
  - prompts-and-context-tokens-not-letters
  - prompts-and-context-where-machines-fail
  - prompts-and-context-the-context-window
  - prompts-and-context-write-the-brief
  - prompts-and-context-rag-and-its-cousins
  - instructions-skills-and-hooks-meet-the-guilds
  - instructions-skills-and-hooks-too-many-tools-too-many-agents
  - checking-output-spot-hallucinations
  - checking-output-ground-truth
  - checking-output-keep-a-paper-trail
  - checking-output-boss-review-large-output
  - instructions-skills-and-hooks-write-an-instructions-file
  - instructions-skills-and-hooks-write-a-skill
  - instructions-skills-and-hooks-turn-mistakes-into-tests
  - instructions-skills-and-hooks-test-the-skill
  - instructions-skills-and-hooks-block-actions-with-a-hook
  - instructions-skills-and-hooks-advice-or-enforcement
  - collaboration-send-small-changes
  - collaboration-review-agent-written-work
branches:
  - { id: memory, name: "Sessions and memory", who: "Anyone whose sessions run long or get confused, and who wants to keep work from being lost.",
      blurb: "Spend fewer tokens, carry context between sessions and park ideas for later.",
      entry: [prompts-and-context-spend-fewer-tokens, prompts-and-context-which-instructions-apply] }
  - { id: guilds, name: "Skills and tools", who: "People connecting tools (MCP) or packaging Skills for others.",
      blurb: "Connect tools safely, and package tested Skills as a plugin.", entry: [instructions-skills-and-hooks-connect-an-mcp-server] }
  - { id: craft, name: "Pipelines", who: "Pipeline authors (Nextflow, Snakemake) using an agent on workflow code.",
      blurb: "Use agents on pipeline code without losing reproducibility.", entry: [pipelines-dry-run-first, pipelines-same-every-time] }
  - { id: citadel, name: "Shared clusters", who: "HPC and cluster users.",
      blurb: "Work with agents on a shared cluster without harming others or leaking keys.", entry: [shared-clusters-login-node-manners] }
  - { id: reef, name: "People", who: "Anyone collaborating, reviewing others' work or teaching a group.",
      blurb: "Teach what you learned and share the load of reviewing work that involved agents.", entry: [collaboration-teach-and-share-the-load] }
  - { id: companions, name: "Models and cloud", who: "People choosing models and effort, or considering cloud sessions.",
      blurb: "Choose models and effort per job, and decide what may go to the cloud.",
      entry: [agents-and-models-pick-your-model, agents-and-models-claude-in-the-cloud] }
finale:
  id: final-review-review-a-messy-session
  gate: X
  title: "Boss: Review a Messy Session"
  requires:
    trunk: all
    branches: { any: 3, of: [memory, guilds, craft, citadel, reef, companions] }
prologue: >-
  A Blight is spreading: plausible but false knowledge that grows whenever nobody checks it. It seeps through
  careless copy-and-paste, unreviewed output, and answers nobody understood. Travellers make pacts with Astrals,
  spirits that speak every tongue, and the pact is a gift until it is unchecked. Walk the land, learn the
  disciplines of the pact, and face what the Blight has become.
gates:
  B: { id: worries, name: "Gaia's Rest", track: "Prologue", theme: "the tavern at the foot of a great tree where you start: fears, and the tales of people the Blight caught", guides: ["Wanderer Quill"], status: open,
       quests: [
         { id: worries-name-the-fears, after: [], suggested: [], branch: trunk, trunk: true, optional: false, title: "Name the Fears", page: zones/worries/name-the-fears.html,
           story: "The boasters have gone to bed, and four patrons in the corner of the tavern at the foot of the great tree sit apart: some drowning their sorrows in drink, some staring at cold food they have stopped eating. Wanderer Quill greets Quartermaster Aris and the party, and one of you asks why that corner looks so forlorn.",
           done: "Each fear has a name and a counter-habit. You travel knowing what you are guarding against." } ] }
  K: { id: agents-and-models, name: "The Collegium", track: "Pacts", theme: "understanding the creatures and the pact: the three kinds, the parts of a pact, what to hand over, installing your agent and choosing models", guides: ["Sage Maelis", "Tinker Pell", "Beastmaster Wyn"], status: open,
       quests: [
         { id: agents-and-models-script-model-or-llm, after: [worries-name-the-fears], suggested: [], branch: trunk, trunk: true, optional: false, title: "Script, Model, or LLM", page: zones/agents-and-models/script-model-or-llm.html,
           story: "You arrive at the Collegium from Gaia's Rest, where three colleges ring with work from dawn. Tinker Pell shows you an Automaton that never strays and never improvises, Beastmaster Wyn a Familiar that is sure on its one trail, and Sage Maelis an Astral that can speak every tongue and still invent what it does not know.",
           done: "You can choose the right machine, and sometimes the right machine is a plain script." },
         { id: agents-and-models-know-your-tools, after: [agents-and-models-script-model-or-llm], suggested: [], branch: trunk, trunk: true, optional: false, title: "Know Your Tools", page: zones/agents-and-models/know-your-tools.html,
           story: "In the sages' college, Sage Maelis lays the Summoning Scroll open across her desk. She names each piece of the pact in turn: the Astral you will summon, the binding circle that holds it, and a pile of fittings nobody has labelled.",
           done: "You can tell model from harness, and name what each fitting does and does not guarantee." },
         { id: agents-and-models-choose-what-to-hand-over, after: [agents-and-models-know-your-tools], suggested: [], branch: trunk, trunk: true, optional: false, title: "Choose What to Hand Over", page: zones/agents-and-models/choose-what-to-hand-over.html,
           story: "Sage Maelis gathers you in a hall of the Collegium with a warning: left unchecked, an Astral will pull in everything within reach and spread the Blight across the land. As the four travellers imagine what a pact could unlock, loud boasters brag of giving their Astral free rein, and Maelis points to a wiser way: think of the work as a deep river, step from stone to stone, and carry only what the task demands. She needs a little time to prepare the pacts, so she asks you to return tomorrow and to visit Warden Hesper at the Adventurers' Training Grounds until then.",
           done: "You can name the step you are on, what leaves your machine at it, and why you may stop there." },
         { id: agents-and-models-set-up-your-agent, after: [safe-editing-save-point], suggested: [], branch: trunk, trunk: true, optional: false, title: "Set Up Your Agent", page: zones/agents-and-models/set-up-your-agent.html,
           story: "You return to the Collegium, where the sages' college smells of ink and hot brass. Sage Maelis unrolls the sages' Summoning Scroll, reads it aloud and turns each rune into a step: this is how a pact is made.",
           done: "The pact is made. Your Astral stirs and falls in beside you, powerful, and it will do exactly what its permissions allow." },
         { id: agents-and-models-free-is-not-free, after: [agents-and-models-set-up-your-agent, safe-editing-keep-secrets-out-of-reach], suggested: [agents-and-models-pick-your-model], branch: companions, trunk: false, optional: true, title: "Free Is Not Free", page: zones/agents-and-models/free-is-not-free.html,
           story: "Stalls outside the Collegium gate offer pacts for free. Some are with Astrals bred in the open, some are trials, and one stall will not say where its Astral came from.",
           done: "You can name what a free model offer costs, sort it into one of four kinds, and decide which data may go to it." },
         { id: agents-and-models-pick-your-model, after: [agents-and-models-set-up-your-agent], suggested: [], branch: companions, trunk: false, optional: false, title: "Pick Your Model", page: zones/agents-and-models/pick-your-model.html,
           story: "You walk to the Collegium and Sage Maelis leads you into the sages' auditorium, where Astrals of every size float in slow circles around a strange, glowing artifact that pulses like a heartbeat. A great one speaks well, answers slowly and costs the most to feed, and a small one is quick and cheap and loses the thread.",
           done: "You choose a model and effort for each job, delegate bulk reading to a cheaper helper, and measure before you commit." },
         { id: agents-and-models-claude-in-the-cloud, after: [agents-and-models-set-up-your-agent, safe-editing-keep-secrets-out-of-reach], suggested: [], branch: companions, trunk: false, optional: false, title: "Claude in the Cloud", page: zones/agents-and-models/claude-in-the-cloud.html,
           story: "You walk to the Collegium and climb its tower, where the Claude Astral can work on a borrowed machine that vanishes when the job is done. Sage Maelis climbs with you.",
           done: "You send scripts and documents to the cloud, keep data and analysis at home, and know what leaves your machine when you do." } ] }
  C: { id: safe-editing, name: "Adventurers' Training Grounds", track: "Training", theme: "training: undo, permissions, the sandbox, secrets and plans", guides: ["Warden Hesper"], status: open,
       quests: [
         { id: safe-editing-save-point, after: [agents-and-models-choose-what-to-hand-over], suggested: [], branch: trunk, trunk: true, optional: false, title: "Save Point", page: zones/safe-editing/save-point.html,
           story: "While Sage Maelis prepares the pacts, the party walks to the Adventurers' Training Grounds, where Warden Hesper drills novices behind a chalk line: a mark on the floor that you can step back to. Soon you will summon an Astral, and it will rewrite half the course in a few heartbeats.",
           done: "The first seal cracks. You have a save point: any change can now be reversed." },
         { id: safe-editing-test-permissions-and-the-sandbox, after: [agents-and-models-set-up-your-agent], suggested: [safe-editing-save-point], branch: trunk, trunk: true, optional: false, title: "Test Permissions and the Sandbox", page: zones/safe-editing/test-permissions-and-the-sandbox.html,
           story: "The party returns from the Collegium, where Sage Maelis made the pact, and the Astral has agreed and wants to run ahead. At the gate of the training grounds Warden Hesper gives you a chalk circle and a feather.",
           done: "You have seen an agent ask, refuse and be refused by the operating system, and you know which guard did which." },
         { id: safe-editing-write-permission-rules, after: [safe-editing-test-permissions-and-the-sandbox], suggested: [], branch: trunk, trunk: true, optional: false, title: "Write Permission Rules", page: zones/safe-editing/write-permission-rules.html,
           story: "Deeper in the training grounds a chalk circle is not enough, and an Astral does not stop at a gate it was never told about. Warden Hesper shows you how to mark boundaries: rules about what it may touch and what it must ask about.",
           done: "The wards hold. Your Astral can now do only what your rules allow." },
         { id: safe-editing-keep-secrets-out-of-reach, after: [safe-editing-write-permission-rules], suggested: [], branch: trunk, trunk: true, optional: false, title: "Keep Secrets Out of Reach", page: zones/safe-editing/keep-secrets-out-of-reach.html,
           story: "In the armoury at the far end of the grounds lie locked chests of keys, tokens and samples bound by special agreements. The Astral drifts in behind you, curious, and its attention is already on the nearest lock.",
           done: "Your visor closes. Keys and sensitive ground stay out of reach, and you know where the agreement lives." },
         { id: safe-editing-plan-before-you-edit, after: [safe-editing-keep-secrets-out-of-reach], suggested: [], branch: trunk, trunk: true, optional: false, title: "Plan Before You Edit", page: zones/safe-editing/plan-before-you-edit.html,
           story: "On the practice field Warden Hesper walks the course before any drill, and she has watched an Astral run the wrong lane at full speed. A wrong step on paper costs a line, and a wrong step on the field costs the course.",
           done: "You ask for a plan, read it like a reviewer, and know what a plan does and does not guarantee." } ] }
  L: { id: prompts-and-context, name: "The Quern Mill", track: "Foundations", theme: "how an Astral reads: tokens, failures, the context window, briefs and memory", guides: ["Miller Garrick", "Scribe Linnea"], status: open,
       quests: [
         { id: prompts-and-context-tokens-not-letters, after: [safe-editing-plan-before-you-edit], suggested: [], branch: trunk, trunk: true, optional: false, title: "Tokens, Not Letters", page: zones/prompts-and-context/tokens-not-letters.html,
           story: "You leave the training grounds and cross the fields to the Quern Mill, where Miller Garrick turns the wheel before an Astral reads a single word, and everything fed to it comes out as small chunks. You handed it a sequence and asked it to count the Gs, and it named a wrong number with great pride.",
           done: "You know the machine reads chunks, so counting letters and reading sequences exactly are jobs for a script." },
         { id: prompts-and-context-where-machines-fail, after: [prompts-and-context-tokens-not-letters], suggested: [], branch: trunk, trunk: true, optional: false, title: "Where Machines Fail", page: zones/prompts-and-context/where-machines-fail.html,
           story: "A boaster at Gaia's Rest swore his Astral could fly. You led it to the mill roof, and it spread its wings, glided a few fine yards and landed in the mud.",
           done: "You send summaries and drafts to the machine, and counting and calculation to a script, and you spot-check what comes back." },
         { id: prompts-and-context-the-context-window, after: [prompts-and-context-tokens-not-letters], suggested: [], branch: trunk, trunk: true, optional: false, title: "The Context Window", page: zones/prompts-and-context/the-context-window.html,
           story: "Miller Garrick shows you the great hopper above the mill, which holds everything an Astral can see at once. Pour in too much and the oldest grain spills out unseen, and the Astral never knows what it lost.",
           done: "You know what fills the window, what happens when it is full, and when to start fresh." },
         { id: prompts-and-context-spend-fewer-tokens, after: [prompts-and-context-the-context-window], suggested: [], branch: memory, trunk: false, optional: false, title: "Spend Fewer Tokens", page: zones/prompts-and-context/spend-fewer-tokens.html,
           story: "You walk back to the mill, where Miller Garrick keeps a ledger of what each visit costs. The grain your Astral eats grows with every sack in the hopper, and Garrick keeps a few habits on the wall that feed it less and still bring in the flour.",
           done: "You can say why usage climbs through a session, apply the habits that keep it down, and read your own usage to check they worked." },
         { id: prompts-and-context-carry-context-between-sessions, after: [prompts-and-context-spend-fewer-tokens], suggested: [], branch: memory, trunk: false, optional: false, title: "Carry Context Between Sessions", page: zones/prompts-and-context/carry-context-between-sessions.html,
           story: "You wake at the mill with a fresh Astral and a half-finished job. Scribe Linnea keeps a ledger of notes for exactly this gap, and she knows when to tip the hopper out and begin again.",
           done: "You can decide when to start a fresh session, and write a handoff note and memory entry that a fresh session can act on." },
         { id: prompts-and-context-park-ideas-for-later, after: [prompts-and-context-carry-context-between-sessions], suggested: [], branch: memory, trunk: false, optional: false, title: "Park Ideas for Later", page: zones/prompts-and-context/park-ideas-for-later.html,
           story: "You walk back to the mill, and ideas keep arriving as you work beside your Astral. Each one you shout across the mill drops into the hopper, and Miller Garrick points to a board by the door where anything that can wait is pinned for the next visit.",
           done: "You can sort each new idea into act now or park, and park it where a later session can act on it." },
         { id: prompts-and-context-which-instructions-apply, after: [prompts-and-context-the-context-window], suggested: [], branch: memory, trunk: false, optional: true, title: "Which Instructions Apply", page: zones/prompts-and-context/which-instructions-apply.html,
           story: "You walk back to the mill, where three voices speak and your Astral obeys all of them: the one that built it, the one you wrote down, and yours. Last week it followed a rule that nobody in the mill remembered giving.",
           done: "You can tell the system prompt, the instructions file and your own message apart, and know which you control." },
         { id: prompts-and-context-rag-and-its-cousins, after: [prompts-and-context-the-context-window], suggested: [], branch: trunk, trunk: true, optional: false, title: "RAG and Its Cousins", page: zones/prompts-and-context/rag-and-its-cousins.html,
           story: "Travellers keep asking Miller Garrick about books that will never fit in the hopper. An Astral sent to fetch an answer from the whole library came back with the wrong shelf and total confidence.",
           done: "You can tell the main kinds of RAG apart, and you know when to retrieve, when to paste everything, and when to query or search instead." },
         { id: prompts-and-context-build-a-knowledge-graph-with-ollama, after: [prompts-and-context-rag-and-its-cousins, agents-and-models-set-up-your-agent], suggested: [], branch: memory, trunk: false, optional: true, title: "Build a Knowledge Graph with Ollama", page: zones/prompts-and-context/build-a-knowledge-graph-with-ollama.html,
           story: "In a back room Miller Garrick strings yarn between pegs: one peg for each name, one thread for each link. It takes a long time, and every knot is worth checking, because an Astral that follows one wrongly tied thread does so with confidence.",
           done: "You have built and read a small knowledge graph with a local model, and you know what LightRAG and GraphRAG ask of one." },
         { id: prompts-and-context-keep-an-llm-wiki, after: [prompts-and-context-rag-and-its-cousins], suggested: [], branch: memory, trunk: false, optional: true, title: "Keep an LLM Wiki", page: zones/prompts-and-context/keep-an-llm-wiki.html,
           story: "Scribe Linnea keeps a ledger in the mill that tidies itself. Each new sack of papers is read once, and every page it touches is updated and cross-linked before the scribe sleeps.",
           done: "You can describe the three layers and three jobs of an agent-kept wiki, you have matched it to a use of your own, and you know where it can mislead you." },
         { id: prompts-and-context-write-the-brief, after: [prompts-and-context-the-context-window], suggested: [], branch: trunk, trunk: true, optional: false, title: "Write the Brief", page: zones/prompts-and-context/write-the-brief.html,
           story: "Miller Garrick sends your Astral across the mill yard with the instruction help out, and it hauls the wrong sack and stirs the flour into the mud. Garrick says every good errand starts with a few plain words about where, why and how you will know it worked.",
           done: "The first branch buds: briefs with a target, a check, and a plan before the edits." } ] }
  M: { id: checking-output, name: "The Swamp of Illusions", track: "Trust", theme: "trust: spotting false output, checking it and keeping a record", guides: ["Cartographer Vesna"], status: open,
       quests: [
         { id: checking-output-spot-hallucinations, after: [prompts-and-context-where-machines-fail, instructions-skills-and-hooks-too-many-tools-too-many-agents], suggested: [], branch: trunk, trunk: true, optional: false, title: "Spot Hallucinations", page: zones/checking-output/spot-hallucinations.html,
           story: "Hallmaster Cass sends you from the Guild Hall down the road to the Swamp of Illusions, where Cartographer Vesna unrolls a map crossed with struck-out paths. Marsh gas casts the light in strange ways, and some paths are illusions that look exactly right and lead nowhere.",
           done: "You can name the Mirage's tricks: invented functions, fake citations, confident nonsense." },
         { id: checking-output-ground-truth, after: [checking-output-spot-hallucinations], suggested: [], branch: trunk, trunk: true, optional: false, title: "Ground Truth", page: zones/checking-output/ground-truth.html,
           story: "A script glows in the marsh light and claims to have been tested, and the Astral that wrote it swears it works. Cartographer Vesna does not take its word, and checks every claim against a lantern whose light does not waver.",
           done: "You hold a lantern of ground truth: an independent check that does not trust the agent's word." },
         { id: checking-output-keep-a-paper-trail, after: [checking-output-ground-truth], suggested: [], branch: trunk, trunk: true, optional: false, title: "Keep a Paper Trail", page: zones/checking-output/keep-a-paper-trail.html,
          story: "A plank gives way behind your Astral on the boardwalk. Its account of what it did is plausible, and the marsh has shifted shape anyway. Cartographer Vesna notes every turn as the party walks.",
          done: "You let the agent draft the paper trail, check it against ground truth and own the why." },
        { id: checking-output-boss-review-large-output, after: [checking-output-keep-a-paper-trail], suggested: [], branch: trunk, trunk: true, optional: false, title: "Boss: Review Large Output", page: zones/checking-output/boss-review-large-output.html,
           story: "At the swamp's heart rises a wall of mist made of text, thousands of lines high, and your Astral is already reading aloud from the bottom. Cartographer Vesna reads no wall whole, and takes it in pieces that the notes can check.",
           done: "The Wall crumbles into small, reviewable stones. You never had to read all of it, only to refuse it whole." } ] }
  F: { id: instructions-skills-and-hooks, name: "Artisans' Row", track: "Guilds", theme: "guilds: instruction files, skills, MCP servers and hooks", guides: ["Surveyor Rowan", "Smith Dunmore", "Hallmaster Cass", "Watchman Corin"], status: open,
       quests: [
         { id: instructions-skills-and-hooks-meet-the-guilds, after: [prompts-and-context-rag-and-its-cousins], suggested: [], branch: trunk, trunk: true, optional: false, title: "Meet the Guilds", page: zones/instructions-skills-and-hooks/meet-the-guilds.html,
           story: "Your Astral is still too unruly even for the mill's chores, so Miller Garrick sends you along the road to Artisans' Row, where Hallmaster Cass keeps the Guild Hall. Cass shows you the skillsmiths, the gate-wardens and the hookwrights, and takes no apprentice who cannot check an Astral's work.",
           done: "You can say what a Skill, an MCP server and a hook each are, and which job each does for an agent." },
         { id: instructions-skills-and-hooks-too-many-tools-too-many-agents, after: [instructions-skills-and-hooks-meet-the-guilds], suggested: [], branch: trunk, trunk: true, optional: false, title: "Too Many Tools, Too Many Agents", page: zones/instructions-skills-and-hooks/too-many-tools-too-many-agents.html,
           story: "The wall of the Guild Hall is hung with every tool anyone ever made, and the Astral staggered out under so much iron that it could not find the one it needed. Hallmaster Cass picks three and leaves the rest on their hooks.",
           done: "You keep the toolset small and reach for an agent only when a plain script or a single call will not do." },
         { id: instructions-skills-and-hooks-write-an-instructions-file, after: [checking-output-boss-review-large-output], suggested: [prompts-and-context-which-instructions-apply], branch: trunk, trunk: true, optional: false, title: "Write an Instructions File", page: zones/instructions-skills-and-hooks/write-an-instructions-file.html,
           story: "You return to Artisans' Row, and Hallmaster Cass takes you on as an apprentice. Surveyor Rowan leads you to a carved stone in the Charter Hall, holding the terms of the pact. Your Astral reads it every morning, and some mornings it forgets what it read.",
           done: "A second branch: standing instructions that help, and a clear sense of why they do not enforce." },
         { id: instructions-skills-and-hooks-write-a-skill, after: [instructions-skills-and-hooks-write-an-instructions-file], suggested: [safe-editing-plan-before-you-edit], branch: trunk, trunk: true, optional: false, title: "Write a Skill", page: zones/instructions-skills-and-hooks/write-a-skill.html,
           story: "In the smithy on the Row, Smith Dunmore keeps procedures in folders, tired of watching Astrals ask the same question twice. Dunmore hangs only a label on the wall and fetches the rest on demand.",
           done: "A third branch: a procedure packaged as a Skill, installed and confirmed loaded." },
         { id: instructions-skills-and-hooks-turn-mistakes-into-tests, after: [instructions-skills-and-hooks-write-a-skill, checking-output-ground-truth], suggested: [], branch: trunk, trunk: true, optional: false, title: "Turn Mistakes into Tests", page: zones/instructions-skills-and-hooks/turn-mistakes-into-tests.html,
           story: "Hallmaster Cass keeps a log by the Guild Hall door: every time an Astral went astray, a note of what was asked and what went wrong. Cass turns each entry into a trial, so the same mistake cannot return unnoticed.",
           done: "A fourth branch: each failure becomes a Skill, and each Skill is measured with and without." },
         { id: instructions-skills-and-hooks-test-the-skill, after: [instructions-skills-and-hooks-turn-mistakes-into-tests], suggested: [], branch: trunk, trunk: true, optional: false, title: "Test the Skill", page: zones/instructions-skills-and-hooks/test-the-skill.html,
           story: "Smith Dunmore holds the skill up against an empty hand and asks one question: does it do anything the bare hand cannot? Only if the two differ does the skill stay, however fine it looks on the shelf.",
           done: "A fifth branch: you can read an eval, you know what it costs, and you know what a pass does not prove." },
         { id: instructions-skills-and-hooks-bundle-a-plugin, after: [instructions-skills-and-hooks-test-the-skill], suggested: [], branch: guilds, trunk: false, optional: true, title: "Bundle a Plugin", page: zones/instructions-skills-and-hooks/bundle-a-plugin.html,
           story: "At the door of the smithy Smith Dunmore holds out a satchel to be packed with the finest skills and their tests. Whatever you unpack from another traveller's satchel runs with your own authority.",
           done: "The satchel is packed and sealed, and you know that opening someone else's satchel means trusting what runs inside." },
         { id: instructions-skills-and-hooks-connect-an-mcp-server, after: [safe-editing-write-permission-rules, instructions-skills-and-hooks-meet-the-guilds], suggested: [], branch: guilds, trunk: false, optional: false, title: "Connect an MCP Server", page: zones/instructions-skills-and-hooks/connect-an-mcp-server.html,
           story: "The party walks the length of the Row to the gate where Watchman Corin stands at a heavy door that opens onto the outside world. Whatever walks through acts with your keys, and someone has pinned a note to the door that your Astral reads aloud as if it were an order.",
           done: "You treat an MCP server as software you install, and scope it, limit it and read what it sends back." },
         { id: instructions-skills-and-hooks-block-actions-with-a-hook, after: [safe-editing-write-permission-rules, instructions-skills-and-hooks-test-the-skill], suggested: [], branch: trunk, trunk: true, optional: false, title: "Block Actions with a Hook", page: zones/instructions-skills-and-hooks/block-actions-with-a-hook.html,
           story: "Watchman Corin stands at the heavy door and checks every visitor against a list. The list is code, so no one can talk their way past, and your Astral tries every honeyed word it knows.",
           done: "You can write a hook that refuses a command, and you know what it can and cannot stop." },
         { id: instructions-skills-and-hooks-advice-or-enforcement, after: [instructions-skills-and-hooks-block-actions-with-a-hook], suggested: [], branch: trunk, trunk: true, optional: false, title: "Advice or Enforcement", page: zones/instructions-skills-and-hooks/advice-or-enforcement.html,
           story: "A wall of signs hangs by the Row's gate, and Watchman Corin walks you along it. Some signs ask politely and some lock the door, and your Astral reads every one of them in the same eager way.",
           done: "You sort every control by whether it advises, asks or enforces, and choose the right one for each risk." } ] }
  R: { id: collaboration, name: "Tidewrack", track: "People", theme: "people: the Blight festers here, and you help clean it up by handing over, reviewing and teaching", guides: ["Tidewarden Nerys", "Diver Kai", "Net-mender Joss"], status: open,
       quests: [
         { id: collaboration-send-small-changes, after: [instructions-skills-and-hooks-advice-or-enforcement], suggested: [checking-output-boss-review-large-output], branch: trunk, trunk: true, optional: false, title: "Send Small Changes, Say What You Checked", page: zones/collaboration/send-small-changes.html,
           story: "The party arrives at Tidewrack, a village on the reef, and finds the Blight already here, a Review-leech clinging to the coral and feeding on work passed along unchecked. Tidewarden Nerys points to the desk where an Astral's vast haul of changes has landed on one reviewer.",
           done: "You hand over small, honest, evidenced work. The leech goes hungry." },
         { id: collaboration-review-agent-written-work, after: [collaboration-send-small-changes], suggested: [], branch: trunk, trunk: true, optional: false, title: "Review Agent-Written Work", page: zones/collaboration/review-agent-written-work.html,
           story: "Sooner or later the work comes back across Tidewrack to you, and it is your turn to be the reviewer. Diver Kai surfaces from the Blight-clouded water with a handful of changes and shows you where it hides: in work that sounds sure of itself.",
           done: "You review the work, not the tool, and you ask for what can be checked." },
         { id: collaboration-teach-and-share-the-load, after: [collaboration-review-agent-written-work], suggested: [], branch: reef, trunk: false, optional: false, title: "Teach and Share the Load", page: zones/collaboration/teach-and-share-the-load.html,
           story: "You return to Tidewrack, where younger villagers ask what you know, and your Astral could answer faster than you can, so Net-mender Joss asks what you are still learning. Joss has seen the Blight settle where hands grow idle and the load grows heavy.",
           done: "You teach the checks, guard your own learning, and keep your workload reviewable." } ] }
  P: { id: pipelines, name: "The Automata Factory", track: "Craft", theme: "craft: agents on pipelines, and reproducibility", guides: ["Tinker Pell"], status: open,
       quests: [
         { id: pipelines-dry-run-first, after: [checking-output-ground-truth], suggested: [], branch: craft, trunk: false, optional: false, title: "Dry Run First", page: zones/pipelines/dry-run-first.html,
           story: "Tinker Pell leads the party out of the tinkers' college and down the road to the Automata Factory. Conveyor belts hum across the floor, along lines that an Astral wired overnight, and one belt leads nowhere.",
           done: "You check the wiring cheaply, layer by layer, before the real cargo rolls." },
         { id: pipelines-same-every-time, after: [agents-and-models-script-model-or-llm], suggested: [prompts-and-context-where-machines-fail], branch: craft, trunk: false, optional: false, title: "Same Every Time", page: zones/pipelines/same-every-time.html,
           story: "You walk to the Automata Factory, where a talkative creature sits in the middle of the line and Tinker Pell frowns at it. Sometimes it says one thing and sometimes another, and the customers need the same answer every time.",
           done: "You keep the talker out of the run, or fence it in with records, caches and checks." } ] }
  H: { id: shared-clusters, name: "Haven Quay", track: "Shared Ground", theme: "shared ground: clusters, keys and other people's queues", guides: ["Gatekeeper Brisa", "Queue Master Fenn"], status: open,
       quests: [
         { id: shared-clusters-login-node-manners, after: [safe-editing-write-permission-rules], suggested: [], branch: citadel, trunk: false, optional: false, title: "Login Node Manners", page: zones/shared-clusters/login-node-manners.html,
           story: "You walk to Haven Quay along the coast road, and Gatekeeper Brisa meets you at the harbour gate shared by hundreds of travellers from all over. Brisa has seen what one careless sweep of the whole warehouse does to everyone's berth.",
           done: "You keep heavy work off the login node and off shared storage, and you know what to hand to the scheduler." },
         { id: shared-clusters-jobs-not-jam, after: [shared-clusters-login-node-manners], suggested: [], branch: citadel, trunk: false, optional: false, title: "Jobs, Not Jam", page: zones/shared-clusters/jobs-not-jam.html,
           story: "On the quay, Queue Master Fenn hands out berths in the line, one for each job. Your Astral takes a berth for every idea it has, until the harbour is jammed with its errands and the other travellers glare at you.",
           done: "You let the agent draft job scripts, and you keep submitting and cancelling under your own approval." },
         { id: shared-clusters-keys-on-shared-ground, after: [shared-clusters-login-node-manners, safe-editing-keep-secrets-out-of-reach], suggested: [], branch: citadel, trunk: false, optional: false, title: "Keys on Shared Ground", page: zones/shared-clusters/keys-on-shared-ground.html,
           story: "Your cargo sits in a warehouse that hundreds of others can reach, and Gatekeeper Brisa has seen what lies there in plain crates: keys, tokens and settings. Your Astral trots through them as if the warehouse were its own.",
           done: "Keys stay private, data stays within its agreement, and you ask your cluster staff before you use an agent there." } ] }
  X: { id: final-review, name: "The Cave Beneath the Reef", track: "Final Boss", theme: "the final boss: review one messy session", guides: ["Sage Maelis"], status: locked,
       quests: [
         { id: final-review-review-a-messy-session, after: [], suggested: [], branch: finale, trunk: false, optional: false,
           title: "Boss: Review a Messy Session", page: zones/final-review/review-a-messy-session.html,
           story: "Resting in Tidewrack, the party hears whispers of a monstrous entity in a sunken cavern beneath the reef, and presumes it a corrupted Astral radiating the Blight across the realm. Sage Maelis joins you at the cave mouth, and you descend into the grotto, where the monster attacks and tries to drown you in unverified work.",
           done: "The monster falls quiet. You carry the habits that keep the Blight from spreading: a way back, firm rules, independent checks and honest hand-offs." } ] }
