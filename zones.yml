# Overworld layout. Legend: . grass  = path  # tree  ~ water  o stone.  Gates are letters (see gates).
map:
  - "####################"
  - "#..F=======T~~~~...#"
  - "#..=.........~~~.=C#"
  - "#..=...K.....~~~.=.#"
  - "#..=...=......N===.#"
  - "#..=...===X......=M#"
  - "#..===============.#"
  - "#..=........=....=.#"
  - "#..B........=....=R#"
  - "#..=........P......#"
  - "#..===L.....=====H.#"
  - "####################"
start: B

# --- Path graph. Per quest: after = hard prerequisites (advice), suggested = soft; branch = trunk or a branch id below.
# Only the finale gate enforces anything. A branch is complete when all its non-optional quests are cleared.
trunk_order:
  - basecamp-name-the-fears
  - basecamp-three-kinds-of-machine
  - basecamp-know-your-gear
  - codon-mill-tokens-not-letters
  - codon-mill-where-machines-fail
  - codon-mill-the-context-window
  - crypt-shield-of-undo
  - kennel-recruit-the-beast
  - crypt-rules-of-the-carapace
  - crypt-secrets-and-sensitive-ground
  - maze-spot-the-mirage
  - maze-ground-truth
  - maze-wall-of-output
branches:
  - { id: memory, name: "Memory and sessions", who: "Anyone whose sessions run long or get confused, and who wants to keep work from being lost.",
      blurb: "Keep long sessions clear, and carry work across the gap between them.",
      entry: [codon-mill-memory-sessions-and-usage, codon-mill-who-said-what] }
  - { id: skills, name: "Skills and plugins", who: "People who repeat the same agent tasks and want to package and test them.",
      blurb: "Turn repeated work into tested Skills and plugins.", entry: [forest-write-the-brief] }
  - { id: guards, name: "Guards", who: "Anyone connecting tools (MCP) or wanting hard rules instead of advice.",
      blurb: "Connect tools safely and enforce rules in code, not advice.", entry: [gatehouse-plug-in-a-server] }
  - { id: craft, name: "Craft", who: "Pipeline authors (Nextflow, Snakemake) using an agent on workflow code.",
      blurb: "Use agents on pipeline code without losing reproducibility.", entry: [factory-dry-run-first, factory-same-every-time] }
  - { id: notebooks, name: "Notebooks", who: "Jupyter and R Markdown users who review analysis in notebooks.",
      blurb: "Review and re-run notebooks so results can be trusted.", entry: [scriptorium-why-notebooks-diff-badly] }
  - { id: citadel, name: "Shared ground", who: "HPC and cluster users.",
      blurb: "Work with agents on a shared cluster without harming others or leaking keys.", entry: [citadel-login-node-manners] }
  - { id: reef, name: "People", who: "Anyone collaborating, reviewing others' work or teaching a group.",
      blurb: "Hand over, review and teach work involving agents, kindly and honestly.", entry: [reef-send-small-say-so] }
  - { id: companions, name: "Companions and cloud", who: "People choosing models and effort, or considering cloud sessions.",
      blurb: "Choose models and effort per job, and decide what may go to the cloud.",
      entry: [kennel-pick-your-companion, kennel-claude-in-the-cloud] }
finale:
  id: murk-clear-the-murk
  gate: X
  title: "Clear the Murk"
  requires:
    trunk: all
    branches: { any: 3, of: [memory, skills, guards, craft, notebooks, citadel, reef, companions] }
prologue: >-
  A Blight is spreading: plausible but false knowledge that grows whenever nobody checks it. It seeps through
  careless copy-and-paste, unreviewed output, and answers nobody understood. The tools are not the enemy. Walk the land,
  recruit companions, build your immunity, and clear the Murk.
gates:
  B: { id: basecamp, name: "Basecamp at the Root",  track: "Prologue",   status: open,
       quests: [
         { id: basecamp-name-the-fears, after: [], suggested: [], branch: trunk, trunk: true, optional: false, title: "Name the Fears", page: zones/basecamp/name-the-fears.html,
           story: "The fire at Basecamp burns low. Around it sit the worries every traveller brings. Name each one, and it shrinks.",
           done: "Each fear has a name and a counter-habit. You travel knowing what you are guarding against." },
         { id: basecamp-three-kinds-of-machine, after: [basecamp-name-the-fears], suggested: [], branch: trunk, trunk: true, optional: false, title: "Three Kinds of Machine", page: zones/basecamp/three-kinds-of-machine.html,
           story: "A workbench holds three machines: one that always repeats, one trained for a single task, one that talks.",
           done: "You can choose the right machine, and sometimes the right machine is a plain script." },
         { id: basecamp-know-your-gear, after: [basecamp-three-kinds-of-machine], suggested: [], branch: trunk, trunk: true, optional: false, title: "Know Your Gear", page: zones/basecamp/know-your-gear.html,
           story: "The quartermaster lays out the kit: a companion, its armour, and a pile of fittings no one has labelled.",
           done: "You can tell model from harness, and name what each fitting does and does not guarantee." } ] }
  L: { id: codon-mill, name: "The Codon Mill", track: "Foundations", status: open,
       quests: [
         { id: codon-mill-tokens-not-letters, after: [basecamp-know-your-gear], suggested: [], branch: trunk, trunk: true, optional: false, title: "Tokens, Not Letters", page: zones/codon-mill/tokens-not-letters.html,
           story: "A mill grinds text into small chunks before the machine reads a word. It never sees the letters you see.",
           done: "You know the machine reads chunks, so counting letters and reading sequences exactly are jobs for a script." },
         { id: codon-mill-where-machines-fail, after: [codon-mill-tokens-not-letters], suggested: [], branch: trunk, trunk: true, optional: false, title: "Where Machines Fail", page: zones/codon-mill/where-machines-fail.html,
           story: "A sign over the mill door lists what the machine does well and what it only seems to do well. Counting letters is on the second list.",
           done: "You send summaries and drafts to the machine, and counting and calculation to a script, and you spot-check what comes back." },
         { id: codon-mill-the-context-window, after: [codon-mill-tokens-not-letters], suggested: [], branch: trunk, trunk: true, optional: false, title: "The Context Window", page: zones/codon-mill/the-context-window.html,
           story: "A great hopper holds everything the machine can see at once. When it overflows, the oldest grain spills out.",
           done: "You know what fills the window, what happens when it is full, and when to start fresh." },
         { id: codon-mill-memory-sessions-and-usage, after: [codon-mill-the-context-window], suggested: [], branch: memory, trunk: false, optional: false, title: "Memory, Sessions and Usage", page: zones/codon-mill/memory-sessions-and-usage.html,
           story: "The mill keeps three ledgers: what it remembers between visits, what it holds during one visit, and what the visit costs. A wrong entry in the first two is hard to erase.",
           done: "You know memory from session context, what burns your usage, and how to clear a context that has gone wrong." },
         { id: codon-mill-when-to-start-fresh, after: [codon-mill-memory-sessions-and-usage], suggested: [], branch: memory, trunk: false, optional: false, title: "When to Start Fresh", page: zones/codon-mill/when-to-start-fresh.html,
           story: "The hopper is filling. A good miller knows the signs that it is time to empty it, and the signs that emptying it would waste the day.",
           done: "You know the signals for a fresh session, the signals to carry on, and how to compact when you want to keep going." },
         { id: codon-mill-the-stream-of-ideas, after: [codon-mill-when-to-start-fresh], suggested: [], branch: memory, trunk: false, optional: false, title: "The Stream of Ideas", page: zones/codon-mill/the-stream-of-ideas.html,
           story: "Ideas keep arriving mid-task: what about this, could we also try that. A single stream floods the hopper. The mill has side channels for them.",
           done: "You park, branch or hand off a side idea so the main task stays clear, and you do not lose the idea." },
         { id: codon-mill-handoff-notes, after: [codon-mill-the-stream-of-ideas], suggested: [], branch: memory, trunk: false, optional: false, title: "Handoff Notes", page: zones/codon-mill/handoff-notes.html,
           story: "A fresh session knows nothing about your task except what loads automatically or is written down.",
           done: "You can write a handoff note a fresh session can act on, and you know which facts belong in memory, in a note, or in git." },
         { id: codon-mill-who-said-what, after: [codon-mill-the-context-window], suggested: [], branch: memory, trunk: false, optional: true, title: "Who Said What", page: zones/codon-mill/who-said-what.html,
           story: "Three voices speak in the mill: the one that built it, the one you wrote down, and yours. Only one of them is you.",
           done: "You can tell the system prompt, the instructions file and your own message apart, and know which you control." },
         { id: codon-mill-too-many-tools-too-many-agents, after: [codon-mill-who-said-what], suggested: [gatehouse-plug-in-a-server], branch: memory, trunk: false, optional: true, title: "Too Many Tools, Too Many Agents", page: zones/codon-mill/too-many-tools-too-many-agents.html,
           story: "The mill wall is hung with every tool anyone ever made. A craftsman picks three. A chain of agents is rarely needed.",
           done: "You keep the toolset small and reach for an agent only when a plain script or a single call will not do." },
         { id: codon-mill-rag-and-its-cousins, after: [codon-mill-the-context-window], suggested: [], branch: memory, trunk: false, optional: true, title: "RAG and Its Cousins", page: zones/codon-mill/rag-and-its-cousins.html,
           story: "Travellers ask the miller about books that never fit the hopper. Some fetch a few pages, some draw a web of names, some say to fetch nothing at all.",
           done: "You can tell the main kinds of RAG apart, and you know when to retrieve, when to paste everything, and when to query or search instead." },
         { id: codon-mill-grow-a-graph-with-ollama, after: [codon-mill-rag-and-its-cousins, kennel-adopt-the-pet], suggested: [], branch: memory, trunk: false, optional: true, title: "Grow a Graph with Ollama", page: zones/codon-mill/grow-a-graph-with-ollama.html,
           story: "In a back room the miller strings yarn between pegs: one peg per name, one thread per link. It takes a long time, and every knot is worth checking.",
           done: "You have built and read a small knowledge graph with a local model, and you know what LightRAG and GraphRAG ask of one." },
         { id: codon-mill-llm-wiki, after: [codon-mill-rag-and-its-cousins], suggested: [], branch: memory, trunk: false, optional: true, title: "Keep a Living Wiki", page: zones/codon-mill/llm-wiki.html,
           story: "A scribe in the mill keeps a ledger that tidies itself. Each new sack of papers is read once, and every page it touches is updated and cross-linked before the scribe sleeps.",
           done: "You can describe the three layers and three jobs of an agent-kept wiki, you have matched it to a use of your own, and you know where it can mislead you." } ] }
  K: { id: kennel,   name: "The Kennel",            track: "Companions", status: open,
       quests: [
         { id: kennel-recruit-the-beast, after: [crypt-shield-of-undo], suggested: [], branch: trunk, trunk: true, optional: false, title: "Recruit the Beast", page: zones/kennel/recruit-the-beast.html,
           story: "A great armoured beast sleeps in the Kennel, strong but unthinking. It will only follow someone who can set it up and keep it on a short lead.",
           done: "The Beast stirs and falls in beside you. It is powerful and will do exactly what its permissions allow." },
         { id: kennel-adopt-the-pet, after: [crypt-shield-of-undo], suggested: [], branch: companions, trunk: false, optional: true, title: "Adopt the Pet", page: zones/kennel/adopt-the-pet.html,
           story: "In a corner, a small pet blinks at you. It lives on your own machine, costs nothing to feed, and forgets things easily.",
           done: "The Pet curls up on your laptop. Small and local, it needs more room to think and a leash of its own." },
         { id: kennel-pick-your-companion, after: [kennel-recruit-the-beast], suggested: [kennel-adopt-the-pet], branch: companions, trunk: false, optional: false, title: "Pick Your Companion", page: zones/kennel/pick-your-companion.html,
           story: "The Kennel keeps companions of every size. A big one is slow and costly to feed; a small one is quick and cheap but loses the trail. You must choose per job, and decide how hard each should think.",
           done: "You choose a model and effort for each job, delegate bulk reading to a cheaper helper, and measure before you commit." },
         { id: kennel-claude-in-the-cloud, after: [kennel-recruit-the-beast, crypt-secrets-and-sensitive-ground], suggested: [], branch: companions, trunk: false, optional: false, title: "Claude in the Cloud", page: zones/kennel/claude-in-the-cloud.html,
           story: "A tower stands far from the Kennel where the Beast works on a borrowed machine that vanishes when it is done. It is fine for sketching and writing. Nothing precious should ever be carried there.",
           done: "You send scripts and documents to the cloud, keep data and analysis at home, and know what leaves your machine when you do." } ] }
  C: { id: crypt,    name: "Ancient DNA Crypt",     track: "Armour",     status: open,
       quests: [
         { id: crypt-shield-of-undo, after: [basecamp-know-your-gear], suggested: [codon-mill-the-context-window], branch: trunk, trunk: true, optional: false, title: "Save Point", page: zones/crypt/shield-of-undo.html,
           story: "The Crypt door is sealed with Murk. A faded note reads: nothing here is safe to touch without a way back.",
           done: "The first seal cracks. You have a save point: any change can now be reversed." },
         { id: crypt-rules-of-the-carapace, after: [kennel-recruit-the-beast], suggested: [kennel-adopt-the-pet], branch: trunk, trunk: true, optional: false, title: "Grow the Carapace", page: zones/crypt/rules-of-the-carapace.html,
           story: "Deeper in the Crypt, bare skin is not enough. You must grow a carapace: rules about what your companions may touch.",
           done: "A carapace hardens over you. Your companions can now only do what your rules allow." },
         { id: crypt-secrets-and-sensitive-ground, after: [crypt-rules-of-the-carapace], suggested: [], branch: trunk, trunk: true, optional: false, title: "The Locked Cabinet", page: zones/crypt/secrets-and-sensitive-ground.html,
           story: "In the deepest chamber lie sealed relics: keys, tokens and samples under special agreements. Not everything here may leave the room.",
           done: "Your visor closes. Keys and sensitive ground stay out of reach, and you know where the agreement lives." } ] }
  M: { id: maze,     name: "Sequence Maze",         track: "Trust",      status: open,
       quests: [
         { id: maze-spot-the-mirage, after: [codon-mill-where-machines-fail], suggested: [], branch: trunk, trunk: true, optional: false, title: "Spot the Mirage", page: zones/maze/spot-the-mirage.html,
           story: "The maze walls shimmer. Some corridors are real and some are Mirages: things that look exactly right and do not exist.",
           done: "You can name the Mirage's tricks: invented functions, fake citations, confident nonsense." },
         { id: maze-ground-truth, after: [maze-spot-the-mirage], suggested: [], branch: trunk, trunk: true, optional: false, title: "Ground Truth", page: zones/maze/ground-truth.html,
           story: "A glowing script claims to have been tested. Only an independent measurement can say whether it is telling the truth.",
           done: "You hold a lantern of ground truth: an independent check that does not trust the agent's word." },
         { id: maze-wall-of-output, after: [maze-ground-truth], suggested: [], branch: trunk, trunk: true, optional: false, title: "Boss: The Wall of Output", page: zones/maze/wall-of-output.html,
           story: "At the maze's heart rises a wall of text, thousands of lines high. It does not attack. It simply cannot be reviewed.",
           done: "The Wall crumbles into small, reviewable stones. You never had to read all of it, only to refuse it whole." } ] }
  F: { id: forest,   name: "Phylogenetic Forest",   track: "Skills",     status: open,
       quests: [
         { id: forest-write-the-brief, after: [kennel-recruit-the-beast], suggested: [codon-mill-the-context-window], branch: skills, trunk: false, optional: false, title: "Write the Brief", page: zones/forest/write-the-brief.html,
           story: "The first branch of the great tree is bare. A vague instruction leaves the sap to wander; a clear one makes the bark grow.",
           done: "The first branch buds: briefs with a target, a check, and a plan before the edits." },
         { id: forest-plan-before-you-edit, after: [forest-write-the-brief], suggested: [], branch: skills, trunk: false, optional: false, title: "Plan Before You Edit", page: zones/forest/plan-before-you-edit.html,
           story: "A surveyor walks the branch before the axe swings. A wrong cut on paper costs a line; a wrong cut on the tree costs the branch.",
           done: "You ask for a plan, read it like a reviewer, and know what a plan does and does not guarantee." },
         { id: forest-the-project-charter, after: [forest-write-the-brief], suggested: [codon-mill-who-said-what], branch: skills, trunk: false, optional: false, title: "The Project Charter", page: zones/forest/the-project-charter.html,
           story: "A carved stone stands at the forest's heart, holding what every traveller should know. It advises. It cannot bind.",
           done: "A second branch: standing instructions that help, and a clear sense of why they do not enforce." },
         { id: forest-forge-a-skill, after: [forest-the-project-charter], suggested: [forest-plan-before-you-edit], branch: skills, trunk: false, optional: false, title: "Forge a Skill", page: zones/forest/forge-a-skill.html,
           story: "In a hollow, a smith keeps procedures in folders, taking each out only when it is needed.",
           done: "A third branch: a procedure packaged as a Skill, installed and confirmed loaded." },
         { id: forest-close-the-loop, after: [forest-forge-a-skill], suggested: [], branch: skills, trunk: false, optional: false, title: "Close the Loop", page: zones/forest/close-the-loop.html,
           story: "A hunter's log hangs from a branch: every time the machine went astray, a note of what was asked and what went wrong.",
           done: "A fourth branch: each failure becomes a Skill, and each Skill is measured with and without." },
         { id: forest-test-the-skill, after: [forest-close-the-loop], suggested: [], branch: skills, trunk: false, optional: false, title: "Test the Skill", page: zones/forest/test-the-skill.html,
           story: "The smith holds the Skill up against an empty hand. Only if the two differ does it stay.",
           done: "A fifth branch: you can read an eval, you know what it costs, and you know what a pass does not prove." },
         { id: forest-bundle-a-plugin, after: [forest-test-the-skill], suggested: [], branch: skills, trunk: false, optional: true, title: "Bundle a Plugin", page: zones/forest/bundle-a-plugin.html,
           story: "At the forest's edge, a satchel waits to be packed with the smith's finest Skills and tests. Whatever you carry, others will unpack.",
           done: "The satchel is packed and sealed, and you know that opening someone else's satchel means trusting what runs inside." } ] }
  T: { id: gatehouse, name: "The Gatehouse", track: "Guards", status: open,
       quests: [
         { id: gatehouse-plug-in-a-server, after: [crypt-rules-of-the-carapace], suggested: [], branch: guards, trunk: false, optional: false, title: "Plug In a Server", page: zones/gatehouse/plug-in-a-server.html,
           story: "A heavy door in the Gatehouse opens onto the outside world. Anything that comes through acts with your keys.",
           done: "You treat an MCP server as software you install, and scope it, limit it and read what it sends back." },
         { id: gatehouse-guard-the-door, after: [gatehouse-plug-in-a-server], suggested: [], branch: guards, trunk: false, optional: false, title: "Guard the Door", page: zones/gatehouse/guard-the-door.html,
           story: "A watchman stands at the door and checks every visitor against a list. The list is code, so no one can talk their way past.",
           done: "You can write a hook that refuses a command, and you know what it can and cannot stop." },
         { id: gatehouse-advice-or-enforcement, after: [gatehouse-guard-the-door], suggested: [], branch: guards, trunk: false, optional: false, title: "Advice or Enforcement", page: zones/gatehouse/advice-or-enforcement.html,
           story: "A wall of signs hangs in the Gatehouse: some ask politely, some lock the door. You must know which is which.",
           done: "You sort every control by whether it advises, asks or enforces, and choose the right one for each risk." } ] }
  R: { id: reef,     name: "Biodiversity Reef",     track: "Level",      status: open,
       quests: [
         { id: reef-send-small-say-so, after: [maze-spot-the-mirage], suggested: [maze-wall-of-output], branch: reef, trunk: false, optional: false, title: "Send Small, Say So", page: zones/reef/send-small-say-so.html,
           story: "A Review-leech clings to the reef, feeding on work passed to others unchecked. Tidy hand-offs starve it.",
           done: "You hand over small, honest, evidenced work. The leech goes hungry." },
         { id: reef-the-reviewers-code, after: [reef-send-small-say-so], suggested: [], branch: reef, trunk: false, optional: false, title: "The Reviewer's Code", page: zones/reef/the-reviewers-code.html,
           story: "Now the work comes to you. Ask for evidence, not for stories, and be kind about it.",
           done: "You review the work, not the tool, and you ask for what can be checked." },
         { id: reef-teach-and-share-the-load, after: [reef-the-reviewers-code], suggested: [], branch: reef, trunk: false, optional: false, title: "Teach and Share the Load", page: zones/reef/teach-and-share-the-load.html,
           story: "A reef thrives on many hands. Teach what you know, protect what you are learning, and take on only what you can review.",
           done: "You teach the checks, guard your own learning, and keep your workload reviewable." } ] }
  P: { id: factory,  name: "Pipeline Factory",      track: "Craft",      status: open,
       quests: [
         { id: factory-dry-run-first, after: [maze-ground-truth], suggested: [], branch: craft, trunk: false, optional: false, title: "Dry Run First", page: zones/factory/dry-run-first.html,
           story: "Conveyor belts hum, but one is wired to nowhere. A cheap test run shows where each belt leads before any real cargo moves.",
           done: "You check the wiring cheaply, layer by layer, before the real cargo rolls." },
         { id: factory-same-every-time, after: [basecamp-three-kinds-of-machine], suggested: [codon-mill-where-machines-fail], branch: craft, trunk: false, optional: false, title: "Same Every Time", page: zones/factory/same-every-time.html,
           story: "A talkative machine sits in the middle of the line. Sometimes it says one thing, sometimes another. The factory needs the same every time.",
           done: "You keep the talker out of the run, or fence it in with records, caches and checks." },
         { id: factory-read-the-rails, after: [factory-dry-run-first], suggested: [], branch: craft, trunk: false, optional: false, title: "Read the Rails", page: zones/factory/read-the-rails.html,
           story: "The rails look sound, but one points at a private road and another melts the cargo it carries.",
           done: "You read the rails for hidden paths, undeclared outputs and overwritten inputs." } ] }
  N: { id: scriptorium, name: "The Scriptorium", track: "Side Quest", status: open,
       quests: [
         { id: scriptorium-why-notebooks-diff-badly, after: [crypt-shield-of-undo], suggested: [], branch: notebooks, trunk: false, optional: false, title: "Why Notebooks Diff Badly", page: zones/scriptorium/why-notebooks-diff-badly.html,
           story: "Scribes here keep notebooks, but every page is stuffed with outputs and images. Reviewing a change means wading through all of it.",
           done: "You know why a notebook review is hard, and how to make the changes visible." },
         { id: scriptorium-run-it-top-to-bottom, after: [crypt-shield-of-undo], suggested: [scriptorium-why-notebooks-diff-badly], branch: notebooks, trunk: false, optional: false, title: "Run It Top to Bottom", page: zones/scriptorium/run-it-top-to-bottom.html,
           story: "A notebook can hold a result nobody can reproduce. The order of work matters more than the page.",
           done: "You check a notebook by running it fresh from top to bottom, and you review the code, not the outputs." } ] }
  H: { id: citadel, name: "The Cluster Citadel", track: "Shared Ground", status: open,
       quests: [
         { id: citadel-login-node-manners, after: [crypt-rules-of-the-carapace], suggested: [], branch: citadel, trunk: false, optional: false, title: "Login Node Manners", page: zones/citadel/login-node-manners.html,
           story: "The Citadel gate is shared by hundreds. One careless sweep of the whole library slows everyone.",
           done: "You keep heavy work off the login node and off shared storage, and you know what to hand to the scheduler." },
         { id: citadel-jobs-not-jam, after: [citadel-login-node-manners], suggested: [], branch: citadel, trunk: false, optional: false, title: "Jobs, Not Jam", page: zones/citadel/jobs-not-jam.html,
           story: "A queue master hands out places in line. An agent that submits jobs freely can fill every place.",
           done: "You let the agent draft job scripts, and you keep submitting and cancelling under your own approval." },
         { id: citadel-keys-on-shared-ground, after: [citadel-login-node-manners, crypt-secrets-and-sensitive-ground], suggested: [], branch: citadel, trunk: false, optional: false, title: "Keys on Shared Ground", page: zones/citadel/keys-on-shared-ground.html,
           story: "Your home directory lies on ground that others can reach. Keys, tokens and agent settings do not belong in a shared place.",
           done: "Keys stay private, data stays within its agreement, and you ask your cluster staff before you use an agent there." } ] }
  X: { id: murk, name: "The Murk's Heart", track: "Final Boss", status: locked,
       quests: [
         { id: murk-clear-the-murk, after: [], suggested: [], branch: finale, trunk: false, optional: false,
           title: "Boss: Clear the Murk", page: zones/murk/clear-the-murk.html,
           story: "At the centre of the land the Murk has gathered into one dark knot. The Murk is every unchecked answer you met on the way, pressed together.",
           done: "The Murk thins and lifts. You carry the habits that keep the Blight from spreading: a way back, firm rules, independent checks and honest hand-offs." } ] }
