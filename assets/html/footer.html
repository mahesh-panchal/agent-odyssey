<script>
(function () {
  var l = document.querySelector('link[href$="assets/css/rpg.css"]');
  var base = l ? l.getAttribute("href").replace("assets/css/rpg.css", "") : "./";
  window.AO_BASE = base;
  ["state", "log", "world", "nav", "tests"].reduce(function (p, n) {
    return p.then(function () {
      return new Promise(function (res) {
        var s = document.createElement("script");
        s.src = base + "assets/js/" + n + ".js"; s.onload = res; document.body.appendChild(s);
      });
    });
  }, Promise.resolve());
})();
</script>
