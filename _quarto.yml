project:
  type: website
  pre-render: python tools/prerender.py
  render:
    - "**/*.qmd"    # only quest and top-level pages; .md and .ipynb files (docs, research, exercises) ship as plain files
  resources:
    - assets/data
    - assets/js
    - assets/img
    - exercises

website:
  title: "Agent Odyssey"
  navbar: false

format:
  html:
    theme: darkly
    css: assets/css/rpg.css
    include-after-body: assets/html/footer.html
    toc: false
